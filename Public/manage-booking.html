<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage My Booking | AIR KERALA</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="site-common.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(7, 27, 46, 0.6), rgba(7, 27, 46, 0.7)),
                url("https://images.unsplash.com/photo-1542296332-2e4473faf563?auto=format&fit=crop&w=2200&q=90");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #17202a;
        }

        .manage-page {
            max-width: 1100px;
            margin: 100px auto 60px;
            padding: 20px;
        }

        .page-header-box {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .page-title {
            color: #071b2e;
            font-size: 30px;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .page-subtitle {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }

        .booking-tabs {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 2px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            position: relative;
            transition: 0.25s;
        }

        .tab-btn.active {
            color: #0878d1;
        }

        .tab-btn.active::after {
            content: "";
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 3px;
            background: #0878d1;
            border-radius: 3px;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 14px;
            padding: 26px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.2s;
        }

        .booking-card:hover {
            transform: translateY(-2px);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .pnr-box {
            font-size: 13px;
            color: #64748b;
        }

        .pnr-box strong {
            font-size: 18px;
            color: #071b2e;
            letter-spacing: 0.5px;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }

        .status-confirmed { background: #dcfce7; color: #15803d; }
        .status-pending { background: #fef9c3; color: #a16207; }
        .status-cancelled { background: #fee2e2; color: #b91c1c; }
        .status-paid { background: #e0f2fe; color: #0369a1; }
        .status-refunded { background: #f1f5f9; color: #475569; }

        .trip-type-badge {
            background: #f1f5f9;
            color: #334155;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 8px;
        }

        .route-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .route-point {
            flex: 1;
            min-width: 140px;
        }

        .route-code {
            font-size: 26px;
            font-weight: 800;
            color: #071b2e;
        }

        .route-name {
            font-size: 12px;
            color: #64748b;
        }

        .route-arrow {
            color: #0878d1;
            font-size: 22px;
            font-weight: bold;
        }

        .segment-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 12px;
        }

        .passenger-list {
            margin-top: 15px;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 16px;
        }

        .passenger-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 13px;
        }

        .passenger-item:last-child {
            border-bottom: none;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view {
            background: #0878d1;
            color: white;
        }

        .btn-view:hover {
            background: #0565b0;
            color: white;
        }

        .btn-cancel {
            background: #ef4444;
            color: white;
        }

        .btn-cancel:hover {
            background: #dc2626;
        }

        .btn-pay {
            background: #16a34a;
            color: white;
        }

        .btn-pay:hover {
            background: #15803d;
        }

        .empty-container {
            background: white;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            color: #64748b;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .empty-container h3 {
            color: #071b2e;
            margin-bottom: 8px;
        }
    
        /* ---------- RESPONSIVE (tablet + mobile) ---------- */
        .route-code, .route-name, .pnr-box { overflow-wrap: anywhere; }
        .booking-tabs { overflow-x: auto; scrollbar-width: none; }
        .booking-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { white-space: nowrap; }
        @media (max-width: 900px) {
            .manage-page { margin-top: 40px; padding: 16px; }
        }
        @media (max-width: 600px) {
            body { background-attachment: scroll; }
            .manage-page { margin: 16px auto 40px; padding: 10px; }
            .page-header-box { padding: 20px 16px; }
            .page-title { font-size: 24px; }
            .booking-tabs { gap: 4px; }
            .tab-btn { flex: 1; padding: 12px 8px; font-size: 13px; white-space: normal; text-align: center; min-height: 48px; }
            .booking-card { padding: 18px 14px; }
            .booking-card:hover { transform: none; }
            .card-top { flex-direction: column; align-items: flex-start; }
            .route-info { gap: 10px; }
            .route-point { min-width: 100px; }
            .route-arrow { transform: rotate(90deg); margin: 0 auto; }
            .passenger-item { flex-direction: column; align-items: flex-start; gap: 4px; }
            .action-btns { flex-direction: column; }
            .btn-action { width: 100%; justify-content: center; min-height: 46px; }
        }
    </style>
</head>

<body>

    <script src="site-common.js" data-page="manage" data-auth="modal"></script>

    <main class="manage-page">

        <div class="page-header-box">
            <h1 class="page-title">Manage My Bookings</h1>
            <p class="page-subtitle">View, manage, download e-tickets, or cancel your Air Kerala flight bookings.</p>

            <div class="booking-tabs">
                <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">
                    Upcoming / Active Bookings (<span id="activeCount">0</span>)
                </button>
                <button class="tab-btn" id="tabCancelled" onclick="switchTab('cancelled')">
                    Past / Cancelled Bookings (<span id="cancelledCount">0</span>)
                </button>
            </div>
        </div>

        <div id="bookingListContainer">
            <div class="empty-container">
                <div class="spinner-border text-primary mb-3"></div>
                <div>Loading your bookings from server...</div>
            </div>
        </div>

    </main>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let allBookingsList = [];
        let currentTab = 'active';

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchUserBookings();
        });

        async function fetchUserBookings() {
            const container = document.getElementById('bookingListContainer');
            try {
                // Auth check first
                const authRes = await fetch('/api/auth/me', { credentials: 'include' });
                const authData = await authRes.json();
                if (!authData.success || !authData.authenticated) {
                    container.innerHTML = `
                        <div class="empty-container">
                            <h3>Please log in</h3>
                            <p>Log in to view and manage your bookings.</p>
                            <button class="btn btn-primary mt-2" onclick="AKAuth.openLogin(fetchUserBookings)">Login</button>
                        </div>
                    `;
                    AKAuth.openLogin(fetchUserBookings);
                    return;
                }

                const response = await fetch('/api/my-bookings', { credentials: 'include' });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Unable to load bookings.');
                }

                allBookingsList = result.bookings || [];
                updateCounts();
                renderTabContent();

            } catch (err) {
                console.error("Fetch bookings error:", err);
                container.innerHTML = `
                    <div class="empty-container">
                        <h3>Unable to load bookings</h3>
                        <p>${escapeHtml(err.message)}</p>
                        <button class="btn btn-primary mt-2" onclick="fetchUserBookings()">Retry</button>
                    </div>
                `;
            }
        }

        function updateCounts() {
            const activeBookings = allBookingsList.filter(b => b.status !== 'CANCELLED' && b.status !== 'COMPLETED');
            const cancelledBookings = allBookingsList.filter(b => b.status === 'CANCELLED' || b.status === 'COMPLETED');

            document.getElementById('activeCount').textContent = activeBookings.length;
            document.getElementById('cancelledCount').textContent = cancelledBookings.length;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabActive').classList.toggle('active', tab === 'active');
            document.getElementById('tabCancelled').classList.toggle('active', tab === 'cancelled');
            renderTabContent();
        }

        function renderTabContent() {
            const container = document.getElementById('bookingListContainer');

            const filtered = allBookingsList.filter(b => {
                if (currentTab === 'active') {
                    return b.status !== 'CANCELLED' && b.status !== 'COMPLETED';
                } else {
                    return b.status === 'CANCELLED' || b.status === 'COMPLETED';
                }
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-container">
                        <h3>No ${currentTab === 'active' ? 'upcoming' : 'previous'} bookings found</h3>
                        <p>${currentTab === 'active' ? 'You have no active flight reservations at the moment.' : 'No cancelled or past flight records found.'}</p>
                        <a href="index.html" class="btn btn-outline-primary fw-bold mt-2">Book a Flight →</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(booking => {
                const isCancelled = booking.status === 'CANCELLED';
                const isPaid = booking.paymentStatus === 'PAID';
                const isPendingPayment = booking.paymentStatus === 'PENDING' && !isCancelled;

                // Build Segment List
                const flights = Array.isArray(booking.flights) && booking.flights.length > 0
                    ? booking.flights
                    : [{
                        flightNumber: booking.flightNumber,
                        airlineName: booking.airlineName,
                        origin: booking.origin,
                        destination: booking.destination,
                        departureDate: booking.departureDate,
                        departureTime: booking.departureTime,
                        arrivalTime: booking.arrivalTime
                    }];

                const passengers = Array.isArray(booking.passengers) ? booking.passengers : [];

                return `
                    <article class="booking-card">
                        <div class="card-top">
                            <div class="pnr-box">
                                PNR / BOOKING REF<br>
                                <strong>${escapeHtml(booking.bookingReference || 'AK' + String(booking.id).slice(-6).toUpperCase())}</strong>
                                <span class="trip-type-badge">${escapeHtml(booking.tripType || (flights.length > 1 ? 'MULTI_CITY' : 'ONE_WAY'))}</span>
                            </div>
                            <div>
                                <span class="status-badge ${isCancelled ? 'status-cancelled' : 'status-confirmed'} me-1">
                                    ${escapeHtml(booking.status || 'CONFIRMED')}
                                </span>
                                <span class="status-badge ${isPaid ? 'status-paid' : (booking.paymentStatus === 'REFUNDED' ? 'status-refunded' : 'status-pending')}">
                                    ${escapeHtml(booking.paymentStatus || 'PENDING')}
                                </span>
                            </div>
                        </div>

                        <!-- FLIGHT SEGMENTS -->
                        <div class="mt-3">
                            ${flights.map((f, idx) => `
                                <div class="segment-block">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <strong style="color:#0878d1;">Flight ${flights.length > 1 ? idx + 1 + ': ' : ''}${escapeHtml(f.flightNumber || booking.flightNumber || 'AK-101')} (${escapeHtml(f.airlineName || 'Air Kerala')})</strong>
                                        <span class="text-secondary small">📅 ${escapeHtml(f.departureDate || booking.departureDate || '')}</span>
                                    </div>
                                    <div class="route-info my-2">
                                        <div class="route-point">
                                            <div class="route-code">${escapeHtml(f.origin || booking.origin)}</div>
                                            <div class="route-name">Departure: ${escapeHtml(f.departureTime || booking.departureTime || '10:00')}</div>
                                        </div>
                                        <div class="route-arrow">✈</div>
                                        <div class="route-point">
                                            <div class="route-code">${escapeHtml(f.destination || booking.destination)}</div>
                                            <div class="route-name">Arrival: ${escapeHtml(f.arrivalTime || booking.arrivalTime || '12:00')}</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- PASSENGERS -->
                        <div class="passenger-list">
                            <div class="fw-bold mb-2 text-dark small uppercase">Passengers (${passengers.length || 1})</div>
                            ${passengers.map(p => `
                                <div class="passenger-item">
                                    <div>
                                        <strong>👤 ${escapeHtml(p.name || 'Passenger')}</strong>
                                        <span class="ms-2 text-muted">(${escapeHtml(p.cabinClass || 'Economy')})</span>
                                        ${p.mealPreference && p.mealPreference !== 'None' ? `<span class="badge bg-light text-dark ms-1">🍱 ${escapeHtml(p.mealPreference)}</span>` : ''}
                                        ${p.wheelchairRequired === 'YES' ? `<span class="badge bg-warning text-dark ms-1">♿ Wheelchair</span>` : ''}
                                    </div>
                                    <div>
                                        <span>Seat: <strong>${escapeHtml(p.seatNumber || 'Assigned at check-in')}</strong></span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- AMOUNT AND ACTIONS -->
                        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                            <div>
                                <span class="text-muted small">Total Fare:</span>
                                <strong class="fs-5 text-success ms-2">₹${Number(booking.totalAmount || 0).toLocaleString('en-IN')}</strong>
                            </div>

                            <div class="action-btns">
                                <a href="ticket.html?bookingId=${encodeURIComponent(booking.id)}" class="btn-action btn-view">
                                    📄 View E-Ticket
                                </a>

                                ${isPendingPayment ? `
                                    <a href="payment.html?booking_id=${encodeURIComponent(booking.id)}" class="btn-action btn-pay">
                                        💳 Complete Payment
                                    </a>
                                ` : ''}

                                ${!isCancelled ? `
                                    <button type="button" class="btn-action btn-cancel" onclick="cancelBooking('${booking.id}')">
                                        🚫 Cancel Booking
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        async function cancelBooking(bookingId) {
            if (!confirm("Are you sure you want to cancel this booking? This will release reserved seats and request a refund.")) {
                return;
            }

            try {
                const response = await fetch('/api/cancel-booking', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ booking_id: bookingId })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Unable to cancel booking.');
                }

                alert("Booking cancelled successfully.");
                await fetchUserBookings();

            } catch (err) {
                console.error("Cancel booking error:", err);
                alert("Cancellation failed: " + err.message);
            }
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
