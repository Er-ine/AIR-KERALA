<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage My Booking | AIR KERALA</title>

    <link
        rel="stylesheet"
        href="site-common.css"
    >

    <style>

        body {
            margin: 0;
            background: #f5f8fb;
            font-family: Arial, sans-serif;
        }

        .page-header {
            text-align: center;
            padding: 55px 20px 25px;
        }

        .eyebrow {
            color: #0878d1;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .page-header h1 {
            color: #071b2e;
            font-size: 42px;
            font-weight: 800;
            margin: 8px 0;
        }

        .page-header p {
            color: #64748b;
        }

        .container-bookings {
            max-width: 1050px;
            margin: auto;
            padding: 20px 18px 70px;
        }

        .section-title {
            color: #071b2e;
            font-size: 22px;
            font-weight: 800;
            margin: 35px 0 18px;
        }

        .booking-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e8ef;
            margin-bottom: 22px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(7,27,46,.06);
        }

        .booking-top {
            background: #071b2e;
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pnr-label {
            font-size: 10px;
            opacity: .6;
            letter-spacing: 1.5px;
        }

        .pnr {
            font-size: 20px;
            font-weight: 800;
            color: #d7b56d;
        }

        .badge {
            border-radius: 30px;
            padding: 7px 13px;
            font-size: 11px;
            font-weight: 800;
        }

        .confirmed {
            background: #dcfce7;
            color: #15803d;
        }

        .pending {
            background: #fef3c7;
            color: #b45309;
        }

        .paid {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        .completed {
            background: #e5e7eb;
            color: #475569;
        }

        .booking-body {
            padding: 24px;
        }

        .route {
            font-size: 25px;
            font-weight: 800;
            color: #071b2e;
        }

        .route span {
            color: #d7b56d;
            margin: 0 10px;
        }

        .flight {
            color: #64748b;
            margin-top: 5px;
        }

        .facts {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(150px, 1fr)
                );
            gap: 18px;
            margin-top: 25px;
        }

        .label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .value {
            font-weight: 700;
            color: #1e293b;
            margin-top: 3px;
        }

        .actions {
            padding: 0 24px 22px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-air {
            border: 0;
            border-radius: 30px;
            padding: 10px 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: #0878d1;
            color: white;
        }

        .btn-secondary {
            background: white;
            border: 1px solid #071b2e;
            color: #071b2e;
        }

        .btn-danger {
            background: white;
            border: 1px solid #fca5a5;
            color: #b91c1c;
        }

        .details {
            display: none;
            border-top: 1px dashed #d5dee8;
            background: #f9fbfd;
            padding: 25px;
        }

        .details.open {
            display: block;
        }

        .passenger-detail {
            background: white;
            border: 1px solid #e1e8ef;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .passenger-detail h4 {
            color: #071b2e;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .empty {
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            padding: 35px;
            text-align: center;
            color: #64748b;
        }

        @media(max-width:700px) {

            .page-header h1 {
                font-size: 32px;
            }

            .route {
                font-size: 20px;
            }

        }

    </style>

</head>

<body>

<script
    src="site-common.js"
    data-page="manage"
    data-auth="logout"
></script>


<header class="page-header">

    <div class="eyebrow">
        MANAGE BOOKING
    </div>

    <h1>
        My Bookings
    </h1>

    <p>
        View, pay or cancel your Air Kerala bookings.
    </p>

</header>


<main class="container-bookings">

    <section>

        <h2 class="section-title">
            ✈ Upcoming / Active Bookings
        </h2>

        <div id="upcoming"></div>

    </section>


    <section>

        <h2 class="section-title">
            🕘 Previous Bookings
        </h2>

        <div id="previous"></div>

    </section>


    <section>

        <h2 class="section-title">
            ❌ Cancelled Bookings
        </h2>

        <div id="cancelled"></div>

    </section>

</main>


<script>

let bookings = [];


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(
        value == null
            ? ''
            : value
    ).replace(
        /[&<>"']/g,
        char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]
    );
}


function pnr(id) {

    return (
        'AK-' +
        String(id)
            .slice(-8)
            .toUpperCase()
    );
}


function formatDate(value) {

    if (!value)
        return '—';

    const date =
        new Date(
            String(value)
                .replace(' ', 'T')
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    )
        return value;

    return date.toLocaleDateString(
        'en-IN',
        {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        }
    );
}


function formatTime(value) {

    if (!value)
        return '—';

    return String(value)
        .slice(11, 16);
}


/* =========================================================
   BUCKET
========================================================= */

function bucketBooking(booking) {

    if (
        booking.STATUS_ ===
        'CANCELLED'
    )
        return 'cancelled';


    const departure =
        new Date(
            String(
                booking.DEP_TEXT || ''
            ).replace(
                ' ',
                'T'
            )
        );


    if (
        !Number.isNaN(
            departure.getTime()
        ) &&
        departure < new Date()
    )
        return 'previous';


    return 'upcoming';
}


/* =========================================================
   BADGES
========================================================= */

function badges(booking) {

    let html = '';


    if (
        booking.STATUS_ ===
        'CANCELLED'
    ) {

        html +=
            '<span class="badge cancelled">CANCELLED</span>';

    } else {

        html +=
            '<span class="badge confirmed">CONFIRMED</span>';
    }


    if (
        booking.PAYMENT_STATUS ===
        'PAID'
    ) {

        html +=
            '<span class="badge paid">PAID</span>';

    } else if (
        booking.PAYMENT_STATUS ===
        'REFUNDED'
    ) {

        html +=
            '<span class="badge cancelled">REFUNDED</span>';

    } else {

        html +=
            '<span class="badge pending">PAYMENT PENDING</span>';
    }


    return html;
}


/* =========================================================
   CARD
========================================================= */

function bookingCard(
    booking,
    bucket
) {

    const needsPayment =
        bucket === 'upcoming' &&
        booking.STATUS_ !== 'CANCELLED' &&
        booking.PAYMENT_STATUS !== 'PAID';


    const canCancel =
        bucket === 'upcoming' &&
        booking.STATUS_ !== 'CANCELLED';


    return `

        <article
            class="booking-card"
            id="booking-${escapeHtml(
                booking.BOOKING_ID
            )}"
        >

            <div class="booking-top">

                <div>

                    <div class="pnr-label">
                        BOOKING REFERENCE / PNR
                    </div>

                    <div class="pnr">
                        ${escapeHtml(
                            pnr(
                                booking.BOOKING_ID
                            )
                        )}
                    </div>

                </div>


                <div>
                    ${badges(booking)}
                </div>

            </div>


            <div class="booking-body">

                <div class="route">

                    ${escapeHtml(
                        booking.ORIGIN
                    )}

                    <span>✈</span>

                    ${escapeHtml(
                        booking.DESTINATION
                    )}

                </div>


                <div class="flight">

                    ${escapeHtml(
                        booking.AIRLINE_NAME
                    )}

                    ·

                    ${escapeHtml(
                        booking.FLIGHT_NUMBER
                    )}

                </div>


                <div class="facts">

                    <div>

                        <div class="label">
                            Passengers
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                booking.PASSENGER_COUNT
                            )}
                        </div>

                    </div>


                    <div>

                        <div class="label">
                            Travel Date
                        </div>

                        <div class="value">
                            ${formatDate(
                                booking.DEP_TEXT
                            )}
                        </div>

                    </div>


                    <div>

                        <div class="label">
                            Departure
                        </div>

                        <div class="value">
                            ${formatTime(
                                booking.DEP_TEXT
                            )}
                        </div>

                    </div>


                    <div>

                        <div class="label">
                            Seats
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                booking.SEATS
                            )}
                        </div>

                    </div>


                    <div>

                        <div class="label">
                            Total
                        </div>

                        <div class="value">
                            ₹${Number(
                                booking.AMOUNT || 0
                            ).toLocaleString(
                                'en-IN'
                            )}
                        </div>

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="btn-air btn-secondary"
                    onclick="toggleDetails('${escapeHtml(
                        booking.BOOKING_ID
                    )}')"
                >
                    View Details
                </button>


                ${
                    needsPayment
                        ? `
                            <button
                                class="btn-air btn-primary"
                                onclick="completePayment('${escapeHtml(
                                    booking.BOOKING_ID
                                )}')"
                            >
                                Complete Payment
                            </button>
                        `
                        : ''
                }


                ${
                    canCancel
                        ? `
                            <button
                                class="btn-air btn-danger"
                                onclick="cancelBooking(
                                    '${escapeHtml(
                                        booking.BOOKING_ID
                                    )}',
                                    this
                                )"
                            >
                                Cancel Booking
                            </button>
                        `
                        : ''
                }

            </div>


            <div
                class="details"
                id="details-${escapeHtml(
                    booking.BOOKING_ID
                )}"
            >

                ${detailsHtml(booking)}

            </div>

        </article>

    `;
}


/* =========================================================
   DETAILS
========================================================= */

function detailsHtml(booking) {

    const passengers =
        booking.PASSENGERS || [];


    let html = `

        <div class="facts">

            <div>
                <div class="label">
                    Airline
                </div>

                <div class="value">
                    ${escapeHtml(
                        booking.AIRLINE_NAME
                    )}
                </div>
            </div>


            <div>
                <div class="label">
                    Flight
                </div>

                <div class="value">
                    ${escapeHtml(
                        booking.FLIGHT_NUMBER
                    )}
                </div>
            </div>


            <div>
                <div class="label">
                    Cabin
                </div>

                <div class="value">
                    ${escapeHtml(
                        booking.CLASS
                    )}
                </div>
            </div>


            <div>
                <div class="label">
                    Payment
                </div>

                <div class="value">
                    ${escapeHtml(
                        booking.PAYMENT_STATUS
                    )}
                </div>
            </div>

        </div>

    `;


    passengers.forEach(
        (passenger, index) => {

            html += `

                <div class="passenger-detail">

                    <h4>
                        Passenger ${index + 1}
                        ·
                        ${escapeHtml(
                            passenger.NAME
                        )}
                    </h4>


                    <div class="facts">

                        <div>

                            <div class="label">
                                Age
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.AGE
                                )}
                            </div>

                        </div>


                        <div>

                            <div class="label">
                                Gender
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.GENDER
                                )}
                            </div>

                        </div>


                        <div>

                            <div class="label">
                                Passport / ID
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.PASSPORT_NUMBER
                                )}
                            </div>

                        </div>


                        <div>

                            <div class="label">
                                Seat
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.SEAT_NUMBER
                                )}
                            </div>

                        </div>


                        <div>

                            <div class="label">
                                Meal
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.MEAL_PREFERENCE ||
                                    'None'
                                )}
                            </div>

                        </div>


                        <div>

                            <div class="label">
                                Special Assistance
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.SPECIAL_ASSISTANCE ||
                                    'None'
                                )}
                            </div>

                        </div>


                        <div>

                            <div class="label">
                                Wheelchair
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.WHEELCHAIR_REQUIRED ||
                                    'NO'
                                )}
                            </div>

                        </div>


                        <div>

                            <div class="label">
                                Infant Bassinet
                            </div>

                            <div class="value">
                                ${escapeHtml(
                                    passenger.INFANT_BASSINET_REQUIRED ||
                                    'NO'
                                )}
                            </div>

                        </div>

                    </div>

                </div>

            `;
        }
    );


    return html;
}


/* =========================================================
   TOGGLE DETAILS
========================================================= */

function toggleDetails(id) {

    const element =
        document.getElementById(
            'details-' + id
        );


    if (element) {

        element.classList.toggle(
            'open'
        );
    }
}


/* =========================================================
   PAYMENT
========================================================= */

function completePayment(id) {

    localStorage.setItem(
        'booking_id',
        String(id)
    );


    window.location.href =
        'payment.html?booking_id=' +
        encodeURIComponent(
            id
        );
}


/* =========================================================
   CANCEL
========================================================= */

async function cancelBooking(
    id,
    button
) {

    const confirmed =
        confirm(
            'Are you sure you want to cancel this booking?'
        );


    if (!confirmed)
        return;


    button.disabled =
        true;


    try {

        const response =
            await fetch(
                '/api/cancel-booking',
                {
                    method: 'PUT',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    credentials:
                        'include',

                    body:
                        JSON.stringify({
                            booking_id:
                                String(id)
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                'Could not cancel booking'
            );
        }


        alert(
            'Booking cancelled successfully.'
        );


        await loadBookings();

    } catch (error) {

        alert(
            'Could not cancel booking: ' +
            error.message
        );

        button.disabled =
            false;
    }
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const upcoming =
        document.getElementById(
            'upcoming'
        );

    const previous =
        document.getElementById(
            'previous'
        );

    const cancelled =
        document.getElementById(
            'cancelled'
        );


    upcoming.innerHTML =
        '';

    previous.innerHTML =
        '';

    cancelled.innerHTML =
        '';


    const groups = {

        upcoming: [],

        previous: [],

        cancelled: []
    };


    bookings.forEach(
        booking => {

            const bucket =
                bucketBooking(
                    booking
                );

            groups[
                bucket
            ].push(
                booking
            );
        }
    );


    upcoming.innerHTML =
        groups.upcoming.length
            ? groups.upcoming
                .map(
                    b =>
                        bookingCard(
                            b,
                            'upcoming'
                        )
                )
                .join('')
            : `
                <div class="empty">
                    No upcoming bookings.
                </div>
            `;


    previous.innerHTML =
        groups.previous.length
            ? groups.previous
                .map(
                    b =>
                        bookingCard(
                            b,
                            'previous'
                        )
                )
                .join('')
            : `
                <div class="empty">
                    No previous bookings.
                </div>
            `;


    cancelled.innerHTML =
        groups.cancelled.length
            ? groups.cancelled
                .map(
                    b =>
                        bookingCard(
                            b,
                            'cancelled'
                        )
                )
                .join('')
            : `
                <div class="empty">
                    No cancelled bookings.
                </div>
            `;
}


/* =========================================================
   LOAD
========================================================= */

async function loadBookings() {

    try {

        const response =
            await fetch(
                '/api/my-bookings',
                {
                    credentials:
                        'include'
                }
            );


        if (
            response.status ===
            401
        ) {

            window.location.href =
                'index.html';

            return;
        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                'Could not load bookings'
            );
        }


        bookings =
            data.bookings || [];


        /*
         * Fetch detailed passenger
         * information for each booking.
         */
        for (
            const booking
            of bookings
        ) {

            try {

                const detailResponse =
                    await fetch(
                        '/api/booking-details/' +
                        encodeURIComponent(
                            booking.BOOKING_ID
                        ),
                        {
                            credentials:
                                'include'
                        }
                    );


                const detailData =
                    await detailResponse.json();


                if (
                    detailResponse.ok &&
                    detailData.success
                ) {

                    const detail =
                        detailData.data;


                    booking.PASSENGERS =
                        detail.PASSENGERS ||
                        [];

                    booking.AMOUNT =
                        detail.AMOUNT;

                    booking.PAYMENT_STATUS =
                        detail.PAYMENT_STATUS;

                }

            } catch (detailError) {

                console.error(
                    detailError
                );
            }
        }


        render();

    } catch (error) {

        console.error(
            error
        );


        document.getElementById(
            'upcoming'
        ).innerHTML = `

            <div class="empty">

                Could not load your bookings.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;
    }
}


loadBookings();

</script>

</body>
</html>
