<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment | Air Kerala</title>

    <link
        rel="stylesheet"
        href="site-common.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f8fb;
        }

        .payment-page {
            max-width: 900px;
            margin: 110px auto 60px;
            padding: 20px;
        }

        .payment-card {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #123d59;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #71808b;
            margin-bottom: 30px;
        }

        .booking-summary {
            background: #f1f8fc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .summary-label {
            font-size: 12px;
            color: #71808b;
            text-transform: uppercase;
        }

        .summary-value {
            color: #123d59;
            font-weight: 700;
            margin-top: 5px;
        }

        .amount-box {
            text-align: center;
            padding: 20px;
            border-radius: 14px;
            background: #eef8f2;
            margin-bottom: 25px;
        }

        .amount-label {
            color: #587066;
        }

        .amount {
            font-size: 32px;
            font-weight: 800;
            color: #146c43;
            margin-top: 5px;
        }

        .methods {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .method-btn {
            flex: 1;
            min-width: 120px;
            padding: 13px;
            border: 1px solid #d5e0e7;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .method-btn.active {
            border-color: #123d59;
            background: #123d59;
            color: white;
        }

        .payment-section {
            display: none;
        }

        .payment-section.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #354957;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5e0e7;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1683bd;
        }

        .full {
            grid-column: 1 / -1;
        }

        .pay-btn {
            width: 100%;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            padding: 16px;
            background: #123d59;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            display: none;
            background: #fff1f1;
            color: #a52b2b;
            border: 1px solid #f0caca;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .success {
            display: none;
            text-align: center;
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .success h2 {
            color: #146c43;
        }

        .receipt {
            margin-top: 25px;
            background: #f5faf7;
            padding: 20px;
            border-radius: 14px;
            text-align: left;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #dce9e1;
        }

        .receipt-row:last-child {
            border-bottom: none;
        }

        .print-btn {
            margin-top: 20px;
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #123d59;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 650px) {

            .payment-card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }

        @media print {

            .no-print {
                display: none !important;
            }

            .payment-page {
                margin: 0;
            }
        }

    </style>

</head>

<body>

<div class="payment-page">

    <div class="payment-card">

        <div id="paymentContent">

            <h1>
                Complete Payment
            </h1>

            <p class="subtitle">
                Secure payment for your Air Kerala booking
            </p>


            <div
                id="errorMessage"
                class="error"
            ></div>


            <!-- BOOKING SUMMARY -->

            <div class="booking-summary">

                <div class="summary-grid">

                    <div>

                        <div class="summary-label">
                            Booking ID
                        </div>

                        <div
                            id="bookingIdDisplay"
                            class="summary-value"
                        >
                            Loading...
                        </div>

                    </div>


                    <div>

                        <div class="summary-label">
                            Flight
                        </div>

                        <div
                            id="flightDisplay"
                            class="summary-value"
                        >
                            Loading...
                        </div>

                    </div>


                    <div>

                        <div class="summary-label">
                            Route
                        </div>

                        <div
                            id="routeDisplay"
                            class="summary-value"
                        >
                            Loading...
                        </div>

                    </div>


                    <div>

                        <div class="summary-label">
                            Passengers
                        </div>

                        <div
                            id="passengersDisplay"
                            class="summary-value"
                        >
                            Loading...
                        </div>

                    </div>

                </div>

            </div>


            <!-- AMOUNT -->

            <div class="amount-box">

                <div class="amount-label">
                    Total Amount
                </div>

                <div
                    id="totalAmount"
                    class="amount"
                >
                    ₹0
                </div>

            </div>


            <!-- PAYMENT METHODS -->

            <div class="methods no-print">

                <button
                    type="button"
                    class="method-btn active"
                    data-method="CARD"
                >
                    Card
                </button>

                <button
                    type="button"
                    class="method-btn"
                    data-method="UPI"
                >
                    UPI
                </button>

            </div>


            <!-- CARD -->

            <div
                id="cardSection"
                class="payment-section active"
            >

                <div class="form-grid">


                    <div class="field full">

                        <label>
                            Card Number
                        </label>

                        <input
                            id="cardNumber"
                            type="text"
                            inputmode="numeric"
                            autocomplete="cc-number"
                            maxlength="23"
                            placeholder="1234 5678 9012 3456"
                        >

                    </div>


                    <div class="field">

                        <label>
                            Expiry Date
                        </label>

                        <input
                            id="expiry"
                            type="text"
                            inputmode="numeric"
                            maxlength="5"
                            placeholder="MM/YY"
                        >

                    </div>


                    <div class="field">

                        <label>
                            CVV
                        </label>

                        <input
                            id="cvv"
                            type="password"
                            inputmode="numeric"
                            maxlength="4"
                            placeholder="CVV"
                        >

                    </div>


                    <!-- CARDHOLDER LAST -->

                    <div class="field full">

                        <label>
                            Cardholder Name
                        </label>

                        <input
                            id="cardholderName"
                            type="text"
                            autocomplete="cc-name"
                            placeholder="Name as shown on card"
                        >

                    </div>

                </div>

            </div>


            <!-- UPI -->

            <div
                id="upiSection"
                class="payment-section"
            >

                <div class="field">

                    <label>
                        UPI ID
                    </label>

                    <input
                        id="upiId"
                        type="text"
                        placeholder="example@upi"
                    >

                </div>

            </div>


            <button
                id="payButton"
                class="pay-btn no-print"
            >
                Pay Now
            </button>

        </div>


        <!-- SUCCESS -->

        <div
            id="successSection"
            class="success"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Payment Successful
            </h2>

            <p>
                Your Air Kerala booking has been confirmed.
            </p>


            <div class="receipt">

                <div class="receipt-row">

                    <span>
                        Booking ID
                    </span>

                    <strong
                        id="receiptBookingId"
                    >
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Flight
                    </span>

                    <strong
                        id="receiptFlight"
                    >
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Passengers
                    </span>

                    <strong
                        id="receiptPassengers"
                    >
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Payment Method
                    </span>

                    <strong
                        id="receiptMethod"
                    >
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Amount Paid
                    </span>

                    <strong
                        id="receiptAmount"
                    >
                    </strong>

                </div>

            </div>


            <button
                class="print-btn no-print"
                onclick="window.print()"
            >
                Print E-Ticket
            </button>

        </div>

    </div>

</div>


<script
    src="site-common.js"
    data-page="payment"
    data-auth="none"
></script>


<script>

    // ========================================================
    // BOOKING ID
    // ========================================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const bookingId =
        params.get('booking_id') ||
        localStorage.getItem('bookingId');


    if (!bookingId) {

        document.getElementById(
            'errorMessage'
        ).textContent =
            'Booking ID is missing.';

        document.getElementById(
            'errorMessage'
        ).style.display =
            'block';

        document.getElementById(
            'payButton'
        ).disabled = true;
    }


    document.getElementById(
        'bookingIdDisplay'
    ).textContent =
        bookingId || '—';


    // ========================================================
    // FORMAT CURRENCY
    // ========================================================

    function formatCurrency(amount) {

        return '₹' +
            Number(amount || 0)
                .toLocaleString('en-IN');
    }


    // ========================================================
    // LOAD BOOKING DETAILS
    // ========================================================

    let bookingAmount = 0;

    async function loadBooking() {

        if (!bookingId) {
            return;
        }

        try {

            const response =
                await fetch(
                    `/api/booking-details/${encodeURIComponent(
                        bookingId
                    )}`,
                    {
                        credentials: 'include'
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    'Could not load booking.'
                );
            }


            const data =
                result.data;


            bookingAmount =
                Number(data.AMOUNT || 0);


            if (
                !Number.isFinite(
                    bookingAmount
                ) ||
                bookingAmount <= 0
            ) {

                throw new Error(
                    'Could not determine booking amount.'
                );
            }


            document.getElementById(
                'totalAmount'
            ).textContent =
                formatCurrency(
                    bookingAmount
                );


            document.getElementById(
                'flightDisplay'
            ).textContent =
                data.FLIGHT_NUMBER || '—';


            document.getElementById(
                'routeDisplay'
            ).textContent =
                `${data.ORIGIN || '—'} → ${data.DESTINATION || '—'}`;


            const passengerList =
                Array.isArray(
                    data.PASSENGERS
                )
                    ? data.PASSENGERS
                    : [];


            document.getElementById(
                'passengersDisplay'
            ).textContent =
                passengerList.length === 1
                    ? '1 Passenger'
                    : `${passengerList.length} Passengers`;

        } catch (error) {

            console.error(error);

            showError(
                error.message
            );
        }
    }


    // ========================================================
    // ERROR
    // ========================================================

    function showError(message) {

        const error =
            document.getElementById(
                'errorMessage'
            );

        error.textContent =
            message;

        error.style.display =
            'block';
    }


    // ========================================================
    // PAYMENT METHOD
    // ========================================================

    let selectedMethod = 'CARD';

    document
        .querySelectorAll('.method-btn')
        .forEach(button => {

            button.addEventListener(
                'click',
                () => {

                    document
                        .querySelectorAll(
                            '.method-btn'
                        )
                        .forEach(btn =>
                            btn.classList.remove(
                                'active'
                            )
                        );

                    button.classList.add(
                        'active'
                    );

                    selectedMethod =
                        button.dataset.method;


                    document
                        .getElementById(
                            'cardSection'
                        )
                        .classList.toggle(
                            'active',
                            selectedMethod === 'CARD'
                        );


                    document
                        .getElementById(
                            'upiSection'
                        )
                        .classList.toggle(
                            'active',
                            selectedMethod === 'UPI'
                        );
                }
            );

        });


    // ========================================================
    // CARD NUMBER AUTO SPACING
    // ========================================================

    document
        .getElementById('cardNumber')
        .addEventListener(
            'input',
            function () {

                let value =
                    this.value
                        .replace(/\D/g, '')
                        .slice(0, 19);

                const groups = [];

                for (
                    let i = 0;
                    i < value.length;
                    i += 4
                ) {

                    groups.push(
                        value.substring(
                            i,
                            i + 4
                        )
                    );
                }

                this.value =
                    groups.join(' ');
            }
        );


    // ========================================================
    // EXPIRY AUTO /
    // ========================================================

    document
        .getElementById('expiry')
        .addEventListener(
            'input',
            function () {

                let value =
                    this.value
                        .replace(/\D/g, '')
                        .slice(0, 4);

                if (
                    value.length >= 3
                ) {

                    value =
                        value.substring(0, 2) +
                        '/' +
                        value.substring(2);
                }

                this.value =
                    value;
            }
        );


    // ========================================================
    // PAY
    // ========================================================

    document
        .getElementById('payButton')
        .addEventListener(
            'click',
            async function () {

                const button =
                    this;

                const error =
                    document.getElementById(
                        'errorMessage'
                    );

                error.style.display =
                    'none';


                if (
                    !bookingId
                ) {

                    showError(
                        'Booking ID is missing.'
                    );

                    return;
                }


                if (
                    !bookingAmount ||
                    bookingAmount <= 0
                ) {

                    showError(
                        'Could not determine booking amount.'
                    );

                    return;
                }


                // --------------------------------------------
                // FRONTEND VALIDATION
                // --------------------------------------------

                if (
                    selectedMethod === 'CARD'
                ) {

                    const card =
                        document
                            .getElementById(
                                'cardNumber'
                            )
                            .value
                            .replace(
                                /\s/g,
                                ''
                            );

                    const expiry =
                        document
                            .getElementById(
                                'expiry'
                            )
                            .value;

                    const cvv =
                        document
                            .getElementById(
                                'cvv'
                            )
                            .value;

                    const name =
                        document
                            .getElementById(
                                'cardholderName'
                            )
                            .value
                            .trim();


                    if (
                        card.length < 12
                    ) {

                        showError(
                            'Please enter a valid card number.'
                        );

                        return;
                    }


                    if (
                        expiry.length !== 5
                    ) {

                        showError(
                            'Please enter the expiry date as MM/YY.'
                        );

                        return;
                    }


                    if (
                        cvv.length < 3
                    ) {

                        showError(
                            'Please enter a valid CVV.'
                        );

                        return;
                    }


                    if (!name) {

                        showError(
                            'Please enter the cardholder name.'
                        );

                        return;
                    }

                } else {

                    const upi =
                        document
                            .getElementById(
                                'upiId'
                            )
                            .value
                            .trim();


                    if (!upi) {

                        showError(
                            'Please enter your UPI ID.'
                        );

                        return;
                    }
                }


                button.disabled =
                    true;

                button.textContent =
                    'Processing Payment...';


                try {

                    const response =
                        await fetch(
                            '/api/payment',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                credentials: 'include',

                                body:
                                    JSON.stringify({

                                        booking_id:
                                            String(
                                                bookingId
                                            ),

                                        payment_method:
                                            selectedMethod

                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        throw new Error(
                            result.message ||
                            'Payment failed.'
                        );
                    }


                    // ----------------------------------------
                    // SUCCESS
                    // ----------------------------------------

                    const paidAmount =
                        Number(
                            result.amount ||
                            bookingAmount
                        );


                    document.getElementById(
                        'receiptBookingId'
                    ).textContent =
                        bookingId;


                    document.getElementById(
                        'receiptFlight'
                    ).textContent =
                        document.getElementById(
                            'flightDisplay'
                        ).textContent;


                    document.getElementById(
                        'receiptPassengers'
                    ).textContent =
                        document.getElementById(
                            'passengersDisplay'
                        ).textContent;


                    document.getElementById(
                        'receiptMethod'
                    ).textContent =
                        selectedMethod;


                    document.getElementById(
                        'receiptAmount'
                    ).textContent =
                        formatCurrency(
                            paidAmount
                        );


                    document.getElementById(
                        'paymentContent'
                    ).style.display =
                        'none';


                    document.getElementById(
                        'successSection'
                    ).style.display =
                        'block';


                    localStorage.removeItem(
                        'bookingTotal'
                    );

                } catch (error) {

                    console.error(error);

                    showError(
                        error.message ||
                        'Payment failed.'
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        'Pay Now';
                }

            }
        );


    // ========================================================
    // START
    // ========================================================

    loadBooking();

</script>

</body>
</html>
