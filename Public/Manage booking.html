<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Booking | AIR KERALA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --air-blue: #0878d1;
            --air-dark: #071b2e;
            --air-gold: #d7b56d;
            --bg-light: #f8fafc;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: #17202a;
        }

        .navbar-solid {
            background: var(--air-dark);
            padding: 22px 5%;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .brand-symbol {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.15);
            font-size: 21px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 10px 17px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
        }

        .nav-links a.active {
            border-bottom: 2px solid var(--air-gold);
        }

        .login-btn {
            border: 1px solid rgba(255,255,255,0.55);
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 9px 18px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: white;
            color: var(--air-dark);
        }

        .booking-container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 5px;
            border: 1px solid #e5e7eb;
        }

        .section-header {
            border-left: 4px solid var(--air-gold);
            padding-left: 15px;
            margin-bottom: 25px;
            font-weight: 700;
            color: var(--air-dark);
        }

        .form-label {
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1px;
            color: #64748b;
            text-transform: uppercase;
        }

        .form-control,
        .form-select {
            border-radius: 3px;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--air-blue);
            box-shadow: none;
        }

        .price-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 5px;
            text-align: right;
            border: 1px dashed var(--air-dark);
        }

        .flight-summary {
            background: #eaf3fc;
            border: 1px solid #cfe4f8;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .btn-pay {
            background: var(--air-blue);
            color: white;
            padding: 15px;
            border-radius: 3px;
            width: 100%;
            font-weight: 700;
            border: none;
            transition: 0.3s;
            margin-top: 20px;
            font-size: 16px;
        }

        .btn-pay:hover {
            background: #0565b0;
            transform: translateY(-2px);
        }

        .ssr-box {
            background: #fdfaf3;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #f3e8cc;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar-solid">
        <a href="index.html" class="brand">
            <div class="brand-symbol">✈</div>
            <div class="brand-name">AIR KERALA</div>
        </a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="flights.html">Book Flight</a>
            <a href="booking.html" class="active">Manage Booking</a>
            <a href="payment.html">Payment</a>
        </nav>
        <button onclick="logout()" class="login-btn">🚪 Logout</button>
    </header>

    <div class="container">
        <div class="booking-container">

            <!-- Flight Summary -->
            <div class="flight-summary">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-bold" style="color: var(--air-blue);" id="bannerAirline">Flight Details</div>
                        <div class="fw-bold fs-5" id="bannerRoute">Loading...</div>
                        <div class="small text-muted" id="bannerTime"></div>
                    </div>

                    <div class="text-end">
                        <div class="small text-muted fw-bold">CABIN CLASS</div>
                        <div class="fw-bold" id="bannerClass">Economy</div>

                        <div class="small text-muted fw-bold mt-1">SEAT</div>
                        <div class="fw-bold" id="bannerSeat">-</div>
                    </div>
                </div>
            </div>

            <!-- Passenger Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="section-header mb-0">Passenger Details</h3>

                <div class="price-card">
                    <small class="fw-bold text-muted">TOTAL FARE</small>
                    <h2 class="fw-bold mb-0" id="livePrice">₹ 5,500</h2>
                </div>
            </div>

            <!-- Form -->
            <form id="mainBookingForm">

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Passenger Name</label>
                        <input type="text" id="pName" class="form-control"
                               placeholder="Full name as per ID" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Age</label>
                        <input type="number" id="pAge" class="form-control"
                               min="1" max="120" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Gender</label>
                        <select id="pGender" class="form-select">
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Passport / ID Number</label>
                        <input type="text" id="pID" class="form-control"
                               placeholder="e.g. P1234567" required>
                    </div>
                </div>

                <!-- SSR -->
                <h5 class="section-header">Special Service Requests</h5>

                <div class="ssr-box mb-4">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Food Preference</label>

                            <select id="mealPref" class="form-select">
                                <option value="None">No Meal Required</option>
                                <option value="Veg">Vegetarian (Veg)</option>
                                <option value="Non-Veg">Non-Vegetarian (Non-Veg)</option>
                                <option value="Vegan">Vegan / Jain Meal</option>
                                <option value="Hindu Non-Veg">Hindu Non-Vegetarian</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Additional Assistance</label>

                            <div class="d-flex gap-3 mt-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ssrWheelchair">
                                    <label class="form-check-label small fw-bold">Wheelchair</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ssrInfant">
                                    <label class="form-check-label small fw-bold">Infant Bassinet</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ssrMedical">
                                    <label class="form-check-label small fw-bold">Medical Support</label>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <button type="submit" class="btn-pay shadow-sm">
                    Proceed to Payment Gateway ➔
                </button>
            </form>

        </div>
    </div>

    <script>
        // Login check
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        // Load flight details
        const flightNum = localStorage.getItem('flightNum') || '';
        const airline = localStorage.getItem('airline') || '';
        const origin = localStorage.getItem('origin') || '';
        const dest = localStorage.getItem('dest') || '';
        const dep = localStorage.getItem('dep') || '';
        const arr = localStorage.getItem('arr') || '';

        // Show banner
        document.getElementById('bannerAirline').textContent = `${airline} · ${flightNum}`;
        document.getElementById('bannerRoute').textContent = `${origin} → ${dest}`;
        document.getElementById('bannerTime').textContent =
            `Departure: ${dep} | Arrival: ${arr}`;
        document.getElementById('bannerClass').textContent =
            localStorage.getItem('cabinClass') || 'Economy';
        document.getElementById('bannerSeat').textContent =
            localStorage.getItem('selectedSeat') || '12A';

        // Price
        function calculatePrice() {
            const saved = localStorage.getItem('bookingTotal');
            if (saved) {
                document.getElementById('livePrice').innerText =
                    '₹ ' + parseInt(saved).toLocaleString();
            }
        }

        // Booking submit
        document.getElementById('mainBookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('pName').value;
            const age = document.getElementById('pAge').value;
            const gender = document.getElementById('pGender').value.toUpperCase();
            const passport = document.getElementById('pID').value;
            const cabin = localStorage.getItem('cabinClass') || 'Economy'; // must match SEAT.CLASS exactly
            const realFlightId = localStorage.getItem('flightId');

            if (!passport) {
                alert('Please enter Passport / ID Number');
                return;
            }

            if (!realFlightId) {
                alert('No live flight selected — please go back and pick a flight again.');
                window.location.href = 'flights.html';
                return;
            }

            try {
                // Passenger
                const pRes = await fetch('/api/passenger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        age,
                        gender,
                        passport_number: passport
                    })
                });

                const pData = await pRes.json();

                if (!pData.success) {
                    alert('Passenger error: ' + pData.message);
                    return;
                }

                // Seat — assigned from real live inventory; price comes back from the DB
                const sRes = await fetch('/api/seat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        flight_id: realFlightId,
                        class: cabin
                    })
                });

                const sData = await sRes.json();

                if (!sData.success) {
                    alert('Seat error: ' + sData.message);
                    return;
                }

                const total = Math.round(sData.price * 1.18); // base fare + 18% tax, sourced from DB
                localStorage.setItem('selectedSeat', sData.seat_number);
                localStorage.setItem('bookingTotal', total);

                // Booking
                const bRes = await fetch('/api/booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_id: 1,
                        flight_id: realFlightId,
                        booking_date: new Date().toISOString().split('T')[0],
                        passenger_id: pData.passenger_id,
                        seat_id: sData.seat_id,
                        meal_preference: document.getElementById('mealPref').value,
                        wheelchair_required:
                            document.getElementById('ssrWheelchair').checked ? 'YES' : 'NO',
                        special_assistance:
                            document.getElementById('ssrMedical').checked ? 'MEDICAL SUPPORT' : null,
                        infant_bassinet_required:
                            document.getElementById('ssrInfant').checked ? 'YES' : 'NO'
                    })
                });

                const bData = await bRes.json();

                if (!bData.success) {
                    alert('Booking failed: ' + bData.message);
                    return;
                }

                localStorage.setItem('booking_id', bData.booking_id);
                localStorage.setItem('passengerName', name);
                localStorage.setItem('passengerID', passport);
                localStorage.setItem('bookingTotal', total);

                window.location.href = 'payment.html';

            } catch (err) {
                alert('Error: ' + err.message);
                console.error(err);
            }
        });

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }

        window.onload = calculatePrice;
    </script>

</body>
</html>
