<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Passenger Details | Air Kerala</title>

    <link
        rel="stylesheet"
        href="site-common.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    rgba(240, 248, 255, 0.88),
                    rgba(255, 255, 255, 0.95)
                ),
                url("assets/plane-bg.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .booking-page {
            max-width: 1050px;
            margin: 110px auto 60px;
            padding: 20px;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            padding: 35px;
            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .page-title {
            text-align: center;
            margin-bottom: 8px;
            color: #123d59;
            font-size: 32px;
        }

        .page-subtitle {
            text-align: center;
            color: #687985;
            margin-bottom: 30px;
        }

        .flight-summary {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 15px;

            padding: 20px;

            background: #f1f8fc;

            border-radius: 16px;

            margin-bottom: 30px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-label {
            font-size: 12px;
            color: #71808b;
            text-transform: uppercase;
        }

        .summary-value {
            font-size: 16px;
            font-weight: 700;
            color: #123d59;
            margin-top: 5px;
        }

        .passenger-count {
            margin-bottom: 25px;
        }

        .passenger-count label {
            display: block;
            font-weight: 700;
            color: #234;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5e0e7;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #1683bd;
            box-shadow:
                0 0 0 3px rgba(22, 131, 189, 0.10);
        }

        .passenger-card {
            border: 1px solid #dce7ed;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            background: #ffffff;
        }

        .passenger-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .passenger-title h3 {
            margin: 0;
            color: #123d59;
        }

        .passenger-number {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #123d59;
            color: white;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #354957;
        }

        .full {
            grid-column: 1 / -1;
        }

        .preferences {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #e5edf1;
        }

        .preferences h4 {
            margin: 0 0 18px;
            color: #123d59;
        }

        .checkbox-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check-item input {
            width: auto;
        }

        .submit-section {
            margin-top: 30px;
            text-align: center;
        }

        .total-box {
            background: #eef8f2;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .total-label {
            color: #587066;
            font-size: 14px;
        }

        .total-value {
            color: #146c43;
            font-size: 27px;
            font-weight: 800;
            margin-top: 5px;
        }

        .continue-btn {
            border: none;
            border-radius: 12px;
            padding: 15px 40px;
            background: #123d59;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #0d2f44;
        }

        .continue-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background: #fff1f1;
            color: #a52b2b;
            border: 1px solid #f0caca;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .required {
            color: #d33;
        }

        @media (max-width: 700px) {

            .booking-page {
                margin-top: 80px;
                padding: 10px;
            }

            .booking-card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .page-title {
                font-size: 25px;
            }
        }

    </style>
</head>

<body>

<div class="booking-page">

    <div class="booking-card">

        <h1 class="page-title">
            Passenger Details
        </h1>

        <p class="page-subtitle">
            Enter the details for everyone travelling on this booking.
        </p>

        <div
            id="errorMessage"
            class="error-message"
        ></div>


        <!-- FLIGHT SUMMARY -->

        <div
            id="flightSummary"
            class="flight-summary"
        >

            <div class="summary-item">
                <div class="summary-label">
                    Flight
                </div>

                <div
                    id="flightNumber"
                    class="summary-value"
                >
                    —
                </div>
            </div>

            <div class="summary-item">
                <div class="summary-label">
                    From
                </div>

                <div
                    id="origin"
                    class="summary-value"
                >
                    —
                </div>
            </div>

            <div class="summary-item">
                <div class="summary-label">
                    To
                </div>

                <div
                    id="destination"
                    class="summary-value"
                >
                    —
                </div>
            </div>

            <div class="summary-item">
                <div class="summary-label">
                    Departure
                </div>

                <div
                    id="departure"
                    class="summary-value"
                >
                    —
                </div>
            </div>

            <div class="summary-item">
                <div class="summary-label">
                    Arrival
                </div>

                <div
                    id="arrival"
                    class="summary-value"
                >
                    —
                </div>
            </div>

        </div>


        <!-- PASSENGER COUNT -->

        <div class="passenger-count">

            <label for="passengerCount">
                Number of Passengers
            </label>

            <select id="passengerCount">

                <option value="1">
                    1 Passenger
                </option>

                <option value="2">
                    2 Passengers
                </option>

                <option value="3">
                    3 Passengers
                </option>

                <option value="4">
                    4 Passengers
                </option>

                <option value="5">
                    5 Passengers
                </option>

                <option value="6">
                    6 Passengers
                </option>

                <option value="7">
                    7 Passengers
                </option>

                <option value="8">
                    8 Passengers
                </option>

                <option value="9">
                    9 Passengers
                </option>

            </select>

        </div>


        <!-- PASSENGERS -->

        <div id="passengersContainer"></div>


        <!-- TOTAL -->

        <div class="submit-section">

            <div class="total-box">

                <div class="total-label">
                    Selected passengers
                </div>

                <div
                    id="passengerTotal"
                    class="total-value"
                >
                    1 Passenger
                </div>

            </div>

            <button
                id="continueButton"
                class="continue-btn"
            >
                Continue to Payment
            </button>

        </div>

    </div>

</div>


<script
    src="site-common.js"
    data-page="book"
    data-auth="account"
></script>


<script>

    // ========================================================
    // SELECTED FLIGHT
    // ========================================================

    const flightId =
        localStorage.getItem('flightId');

    const flightData = {

        flight_number:
            localStorage.getItem('flightNum') || '—',

        airline:
            localStorage.getItem('airline') || 'Air Kerala',

        origin:
            localStorage.getItem('origin') || '—',

        destination:
            localStorage.getItem('dest') || '—',

        departure:
            localStorage.getItem('dep') || '—',

        arrival:
            localStorage.getItem('arr') || '—',

        date:
            localStorage.getItem('flightDate') || ''
    };


    // ========================================================
    // DISPLAY FLIGHT
    // ========================================================

    document.getElementById(
        'flightNumber'
    ).textContent =
        flightData.flight_number;

    document.getElementById(
        'origin'
    ).textContent =
        flightData.origin;

    document.getElementById(
        'destination'
    ).textContent =
        flightData.destination;

    document.getElementById(
        'departure'
    ).textContent =
        flightData.departure;

    document.getElementById(
        'arrival'
    ).textContent =
        flightData.arrival;


    // ========================================================
    // ERROR
    // ========================================================

    function showError(message) {

        const box =
            document.getElementById(
                'errorMessage'
            );

        box.textContent = message;

        box.style.display = 'block';

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }


    function clearError() {

        const box =
            document.getElementById(
                'errorMessage'
            );

        box.style.display = 'none';
        box.textContent = '';
    }


    // ========================================================
    // PASSENGER FORM
    // ========================================================

    function createPassengerCard(index) {

        const number =
            index + 1;

        return `

        <div
            class="passenger-card"
            data-passenger="${number}"
        >

            <div class="passenger-title">

                <h3>
                    Passenger ${number}
                </h3>

                <div class="passenger-number">
                    ${number}
                </div>

            </div>


            <div class="form-grid">


                <!-- FIRST NAME -->

                <div class="field">

                    <label>
                        First Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        class="first-name"
                        placeholder="Enter first name"
                        required
                    >

                </div>


                <!-- SURNAME -->

                <div class="field">

                    <label>
                        Surname
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        class="surname"
                        placeholder="Enter surname"
                        required
                    >

                </div>


                <!-- DOB -->

                <div class="field">

                    <label>
                        Date of Birth
                        <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        class="dob"
                        required
                    >

                </div>


                <!-- GENDER -->

                <div class="field">

                    <label>
                        Gender
                        <span class="required">*</span>
                    </label>

                    <select
                        class="gender"
                        required
                    >

                        <option value="">
                            Select gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PASSPORT -->

                <div class="field">

                    <label>
                        Passport Number
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        class="passport"
                        placeholder="Enter passport number"
                        maxlength="20"
                        required
                    >

                </div>


                <!-- CABIN -->

                <div class="field">

                    <label>
                        Cabin Class
                        <span class="required">*</span>
                    </label>

                    <select
                        class="cabin-class"
                        required
                    >

                        <option value="Economy">
                            Economy
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="First">
                            First
                        </option>

                    </select>

                </div>


            </div>


            <!-- PREFERENCES -->

            <div class="preferences">

                <h4>
                    Meal & Special Assistance
                </h4>


                <div class="form-grid">


                    <!-- MEAL -->

                    <div class="field">

                        <label>
                            Meal Preference
                        </label>

                        <select class="meal">

                            <option value="None">
                                No Preference
                            </option>

                            <option value="Vegetarian">
                                Vegetarian
                            </option>

                            <option value="Non-Vegetarian">
                                Non-Vegetarian
                            </option>

                            <option value="Vegan">
                                Vegan
                            </option>

                            <option value="Jain">
                                Jain
                            </option>

                            <option value="Child Meal">
                                Child Meal
                            </option>

                        </select>

                    </div>


                    <!-- ASSISTANCE -->

                    <div class="field">

                        <label>
                            Special Assistance
                        </label>

                        <select class="assistance">

                            <option value="None">
                                No Assistance
                            </option>

                            <option value="Wheelchair">
                                Wheelchair Assistance
                            </option>

                            <option value="Hearing Assistance">
                                Hearing Assistance
                            </option>

                            <option value="Visual Assistance">
                                Visual Assistance
                            </option>

                            <option value="Medical Assistance">
                                Medical Assistance
                            </option>

                            <option value="Other">
                                Other Assistance
                            </option>

                        </select>

                    </div>


                    <!-- CHECKBOXES -->

                    <div class="field full">

                        <div class="checkbox-row">

                            <label class="check-item">

                                <input
                                    type="checkbox"
                                    class="wheelchair"
                                >

                                Wheelchair Required

                            </label>


                            <label class="check-item">

                                <input
                                    type="checkbox"
                                    class="bassinet"
                                >

                                Infant Bassinet Required

                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        `;
    }
/* =========================================================
   AUTHENTICATION CHECK
========================================================= */

async function checkAuthentication() {

    try {

        const response =
            await fetch(
                '/api/auth/me',
                {
                    method: 'GET',
                    credentials: 'include'
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.authenticated
        ) {

            window.location.href =
                'index.html?login=required';

            return false;
        }


        localStorage.setItem(
            'isLoggedIn',
            'true'
        );

        localStorage.setItem(
            'userId',
            data.user.id
        );

        localStorage.setItem(
            'userName',
            data.user.name
        );

        localStorage.setItem(
            'userEmail',
            data.user.email
        );


        return true;


    } catch (error) {

        console.error(
            'AUTH CHECK ERROR:',
            error
        );

        window.location.href =
            'index.html?login=required';

        return false;
    }
}

    function renderPassengers() {

        const count =
            Number(
                document.getElementById(
                    'passengerCount'
                ).value
            );

        const container =
            document.getElementById(
                'passengersContainer'
            );

        container.innerHTML = '';

        for (
            let i = 0;
            i < count;
            i++
        ) {

            container.insertAdjacentHTML(
                'beforeend',
                createPassengerCard(i)
            );
        }

        document.getElementById(
            'passengerTotal'
        ).textContent =
            count === 1
                ? '1 Passenger'
                : `${count} Passengers`;
    }


    document.getElementById(
        'passengerCount'
    ).addEventListener(
        'change',
        renderPassengers
    );


    renderPassengers();


    // ========================================================
    // SUBMIT
    // ========================================================

    document.getElementById(
        'continueButton'
    ).addEventListener(
        'click',
        async function () {

            clearError();

            if (!flightId) {

                showError(
                    'No flight has been selected. Please go back and select a flight.'
                );

                return;
            }


            const cards =
                document.querySelectorAll(
                    '.passenger-card'
                );

            const passengers = [];


            // ------------------------------------------------
            // COLLECT PASSENGERS
            // ------------------------------------------------

            for (
                let i = 0;
                i < cards.length;
                i++
            ) {

                const card =
                    cards[i];

                const firstName =
                    card.querySelector(
                        '.first-name'
                    ).value.trim();

                const surname =
                    card.querySelector(
                        '.surname'
                    ).value.trim();

                const dob =
                    card.querySelector(
                        '.dob'
                    ).value;

                const gender =
                    card.querySelector(
                        '.gender'
                    ).value;

                const passport =
                    card.querySelector(
                        '.passport'
                    ).value.trim();

                const cabinClass =
                    card.querySelector(
                        '.cabin-class'
                    ).value;

                const meal =
                    card.querySelector(
                        '.meal'
                    ).value;

                const assistance =
                    card.querySelector(
                        '.assistance'
                    ).value;

                const wheelchair =
                    card.querySelector(
                        '.wheelchair'
                    ).checked;

                const bassinet =
                    card.querySelector(
                        '.bassinet'
                    ).checked;


                if (
                    !firstName ||
                    !surname ||
                    !dob ||
                    !gender ||
                    !passport
                ) {

                    showError(
                        `Please complete all required fields for Passenger ${i + 1}.`
                    );

                    card.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });

                    return;
                }


                passengers.push({

                    first_name:
                        firstName,

                    surname:
                        surname,

                    date_of_birth:
                        dob,

                    gender:
                        gender,

                    passport_number:
                        passport,

                    cabin_class:
                        cabinClass,

                    meal_preference:
                        meal,

                    special_assistance:
                        assistance,

                    wheelchair_required:
                        wheelchair,

                    infant_bassinet_required:
                        bassinet
                });
            }


            // ------------------------------------------------
            // DISABLE BUTTON
            // ------------------------------------------------

            const button =
                document.getElementById(
                    'continueButton'
                );

            button.disabled = true;

            button.textContent =
                'Creating Booking...';


            try {

                const response =
                    await fetch(
                        '/api/booking-group',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            credentials: 'include',

                            body: JSON.stringify({

                                flight_id:
                                    flightId,

                                booking_date:
                                    flightData.date ||
                                    new Date()
                                        .toISOString()
                                        .split('T')[0],

                                passengers:
                                    passengers
                            })
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok || !result.success) {

                    throw new Error(
                        result.message ||
                        'Unable to create booking.'
                    );
                }


                // ------------------------------------------------
                // SAVE BOOKING DATA
                // ------------------------------------------------

                localStorage.setItem(
                    'bookingId',
                    String(result.booking_id)
                );

                localStorage.setItem(
                    'bookingTotal',
                    String(result.amount || 0)
                );

                localStorage.setItem(
                    'passengerCount',
                    String(passengers.length)
                );


                // ------------------------------------------------
                // GO PAYMENT
                // ------------------------------------------------

                window.location.href =
                    `payment.html?booking_id=${encodeURIComponent(
                        result.booking_id
                    )}`;

            } catch (error) {

                console.error(error);

                showError(
                    error.message ||
                    'Unable to create booking.'
                );

                button.disabled = false;

                button.textContent =
                    'Continue to Payment';
            }

        }
    );

</script>

</body>
</html>
