<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passenger Booking | AIR KERALA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Shared navbar + footer styles (same as every other page) -->
    <link rel="stylesheet" href="site-common.css">

    <style>
        :root {
            --air-blue: #0878d1;
            --air-dark: #071b2e;
            --air-gold: #d7b56d;
            --bg-light: #f4f8fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #17202a;

            background:
                linear-gradient(
                    rgba(239, 247, 253, 0.94),
                    rgba(248, 251, 255, 0.97)
                ),
                url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* =========================
           NAVBAR
           (Old hardcoded navbar — no longer used. The navbar is
            now provided by site-common.js / site-common.css.)
        ========================== */

        .navbar-solid {
            background: rgba(7, 27, 46, 0.98);
            padding: 15px 5%;
            border-bottom: 1px solid rgba(255,255,255,0.12);

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;
            color: white;
        }

        .brand-logo {
            height: 44px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
        }

        .brand-fallback {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-symbol {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.13);
            font-size: 20px;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.88);
            text-decoration: none;

            padding: 10px 17px;

            font-size: 13px;
            font-weight: 600;

            border-radius: 5px;

            transition: 0.25s;
        }

        .nav-links a:hover {
            color: white;
            background: rgba(255,255,255,0.08);
        }

        .nav-links a.active {
            color: white;
            border-bottom: 2px solid var(--air-gold);
        }

        /* =========================
           MAIN CONTAINER
        ========================== */

        .booking-container {
            max-width: 900px;

            margin: 50px auto;

            background: rgba(255,255,255,0.97);

            padding: 40px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.8);

            box-shadow:
                0 20px 60px rgba(7,27,46,0.15);

            backdrop-filter: blur(10px);
        }

        .section-header {
            border-left: 4px solid var(--air-gold);

            padding-left: 15px;

            margin-bottom: 25px;

            font-weight: 700;

            color: var(--air-dark);
        }

        .form-label {
            font-weight: 700;

            font-size: 11px;

            letter-spacing: 1px;

            color: #64748b;

            text-transform: uppercase;
        }

        .form-control,
        .form-select {
            border-radius: 5px;

            padding: 12px;

            border: 1.5px solid #e2e8f0;

            background: white;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--air-blue);

            box-shadow:
                0 0 0 3px rgba(8,120,209,0.08);
        }

        /* =========================
           SELECTED FLIGHT
        ========================== */

        .flight-summary {
            background:
                linear-gradient(
                    135deg,
                    #eaf5ff,
                    #f5faff
                );

            border: 1px solid #cfe4f8;

            border-radius: 8px;

            padding: 24px;

            margin-bottom: 32px;

            box-shadow: 0 6px 20px rgba(8,120,209,0.07);
        }

        .flight-badge {
            display: inline-block;

            background: var(--air-blue);

            color: white;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .5px;

            margin-bottom: 8px;
        }

        .flight-route {
            font-size: 23px;

            font-weight: 700;

            color: var(--air-dark);
        }

        .flight-meta {
            color: #64748b;

            font-size: 13px;

            margin-top: 5px;
        }

        /* =========================
           PRICE
        ========================== */

        .price-card {
            background: #f1f5f9;

            padding: 18px 22px;

            border-radius: 7px;

            text-align: right;

            border: 1px dashed var(--air-dark);

            min-width: 170px;
        }

        #livePrice {
            color: var(--air-dark);
        }

        /* =========================
           SSR
        ========================== */

        .ssr-box {
            background: #fdfaf3;

            padding: 20px;

            border-radius: 7px;

            border: 1px solid #f3e8cc;
        }

        /* =========================
           PAYMENT BUTTON
        ========================== */

        .btn-pay {
            background: var(--air-blue);

            color: white;

            padding: 15px;

            border-radius: 5px;

            width: 100%;

            font-weight: 700;

            border: none;

            transition: 0.3s;

            margin-top: 20px;

            font-size: 16px;
        }

        .btn-pay:hover {
            background: #0565b0;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(8,120,209,0.2);
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 768px) {

            .navbar-solid {
                padding: 12px 18px;

                flex-wrap: wrap;

                gap: 10px;
            }

            .nav-links {
                width: 100%;

                justify-content: center;

                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 12px;

                padding: 8px 10px;
            }

            .booking-container {
                margin: 25px 12px;

                padding: 22px;
            }

            .flight-route {
                font-size: 19px;
            }

            .price-card {
                margin-top: 15px;

                text-align: left;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <!-- Shared navbar (same as every other page) + footer, injected by site-common.js -->
    <script src="site-common.js" data-page="book" data-auth="none"></script>


    <!-- =========================
         BOOKING
    ========================== -->

    <div class="container">

        <div class="booking-container">

            <!-- =========================
                 SELECTED FLIGHT
            ========================== -->

            <h3 class="section-header">
                Selected Flight
            </h3>

            <div class="flight-summary">

                <div class="row align-items-center">

                    <div class="col-md-8">

                        <div
                            class="flight-badge"
                            id="bannerAirline"
                        >
                            Loading flight...
                        </div>

                        <div
                            class="flight-route"
                            id="bannerRoute"
                        >
                            Loading...
                        </div>

                        <div
                            class="flight-meta"
                            id="bannerTime"
                        >
                            Please wait...
                        </div>

                    </div>

                    <div class="col-md-4 text-md-end mt-3 mt-md-0">

                        <div class="small text-muted fw-bold">
                            CABIN CLASS
                        </div>

                        <select
                            id="cabinSelect"
                            class="form-select form-select-sm mt-1"
                            onchange="onCabinChange()"
                        >
                            <option value="Economy">
                                Economy
                            </option>

                            <option value="Business">
                                Business
                            </option>

                            <option value="First">
                                First
                            </option>
                        </select>

                        <div class="small text-muted fw-bold mt-3">
                            SEAT
                        </div>

                        <div
                            class="fw-bold"
                            id="bannerSeat"
                        >
                            Assigned during booking
                        </div>

                    </div>

                </div>

            </div>


            <!-- =========================
                 PASSENGER HEADER
            ========================== -->

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

                <h3 class="section-header mb-0">
                    Passenger Details
                </h3>

                <div class="price-card">

                    <small class="fw-bold text-muted">
                        TOTAL FARE
                    </small>

                    <h2
                        class="fw-bold mb-0"
                        id="livePrice"
                    >
                        —
                    </h2>

                </div>

            </div>


            <!-- =========================
                 PASSENGER FORM
            ========================== -->

            <form id="mainBookingForm">

                <div class="row g-3 mb-4">

                    <div class="col-md-6">

                        <label class="form-label">
                            Passenger Name
                        </label>

                        <input
                            type="text"
                            id="pName"
                            class="form-control"
                            placeholder="Full name as per ID"
                            required
                        >

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            id="pAge"
                            class="form-control"
                            min="1"
                            max="120"
                            required
                        >

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            id="pGender"
                            class="form-select"
                        >
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>

                    </div>

                </div>


                <div class="row g-3 mb-4">

                    <div class="col-md-6">

                        <label class="form-label">
                            Passport / ID Number
                        </label>

                        <input
                            type="text"
                            id="pID"
                            class="form-control"
                            placeholder="e.g. P1234567"
                            required
                        >

                    </div>

                </div>


                <!-- =========================
                     SPECIAL SERVICES
                ========================== -->

                <h5 class="section-header">
                    Special Service Requests
                </h5>

                <div class="ssr-box mb-4">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Food Preference
                            </label>

                            <select
                                id="mealPref"
                                class="form-select"
                            >

                                <option value="None">
                                    No Meal Required
                                </option>

                                <option value="Veg">
                                    Vegetarian (Veg)
                                </option>

                                <option value="Non-Veg">
                                    Non-Vegetarian (Non-Veg)
                                </option>

                                <option value="Vegan">
                                    Vegan / Jain Meal
                                </option>

                                <option value="Hindu Non-Veg">
                                    Hindu Non-Vegetarian
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Additional Assistance
                            </label>

                            <div class="d-flex gap-3 mt-2 flex-wrap">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="ssrWheelchair"
                                    >

                                    <label
                                        class="form-check-label small fw-bold"
                                        for="ssrWheelchair"
                                    >
                                        Wheelchair
                                    </label>

                                </div>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="ssrInfant"
                                    >

                                    <label
                                        class="form-check-label small fw-bold"
                                        for="ssrInfant"
                                    >
                                        Infant Bassinet
                                    </label>

                                </div>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="ssrMedical"
                                    >

                                    <label
                                        class="form-check-label small fw-bold"
                                        for="ssrMedical"
                                    >
                                        Medical Support
                                    </label>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn-pay shadow-sm"
                >
                    Proceed to Payment Gateway ➔
                </button>

            </form>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           LOGIN CHECK
        ========================== */

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }


        /* =========================
           GET SELECTED FLIGHT
        ========================== */

        const flightId = localStorage.getItem('flightId');

        const flightNum = localStorage.getItem('flightNum');
        const airline = localStorage.getItem('airline');

        const origin = localStorage.getItem('origin');
        const dest = localStorage.getItem('dest');

        const dep = localStorage.getItem('dep');
        const arr = localStorage.getItem('arr');

        const flightDate = localStorage.getItem('flightDate');

        let livePrices = {};
        let liveSeatCounts = {};

        let inventoryReady = false;


        /* =========================
           CHECK FLIGHT
        ========================== */

        if (!flightId || !flightNum || !origin || !dest) {

            alert(
                'Please select a flight before entering passenger details.'
            );

            window.location.href = 'flights.html';

        }


        /* =========================
           DISPLAY FLIGHT
        ========================== */

        document.getElementById('bannerAirline').textContent =
            (airline || 'AIR KERALA') +
            ' · ' +
            (flightNum || '');

        document.getElementById('bannerRoute').textContent =
            (origin || '') +
            ' → ' +
            (dest || '');

        document.getElementById('bannerTime').textContent =
            'Date: ' +
            (flightDate || 'Selected flight date') +
            ' | Departure: ' +
            (dep || 'N/A') +
            ' | Arrival: ' +
            (arr || 'N/A');


        /* =========================
           LOAD REAL INVENTORY
        ========================== */

        async function loadInventory() {

            if (!flightId) {
                return;
            }

            try {

                const res = await fetch(
                    '/api/flights/ensure',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({

                            flight_number: flightNum,

                            airline_name: airline,

                            origin: origin,

                            destination: dest,

                            departure_time:
                                toDateTime(
                                    flightDate,
                                    dep
                                ),

                            arrival_time:
                                toDateTime(
                                    flightDate,
                                    arr
                                )

                        })
                    }
                );


                const data = await res.json();


                if (!data.success) {

                    alert(
                        'Could not load flight availability: ' +
                        (data.message || 'Unknown error')
                    );

                    return;

                }


                /*
                    Use the actual MongoDB flight ID returned
                    by the server.
                */

                if (data.flight_id) {

                    localStorage.setItem(
                        'flightId',
                        data.flight_id
                    );

                }


                livePrices = {};
                liveSeatCounts = {};


                (data.seats || []).forEach(function(row) {

                    livePrices[row.CLASS] =
                        row.price;

                    liveSeatCounts[row.CLASS] =
                        row.available;

                });


                const cabin =
                    document.getElementById(
                        'cabinSelect'
                    );


                Array.from(cabin.options).forEach(
                    function(option) {

                        const available =
                            liveSeatCounts[
                                option.value
                            ] || 0;


                        option.textContent =
                            option.value +
                            ' (' +
                            available +
                            ' left)';


                        option.disabled =
                            available === 0;

                    }
                );


                /*
                    If current cabin has no seats,
                    select first available cabin.
                */

                const current =
                    cabin.value;


                if (
                    liveSeatCounts[current] === 0
                ) {

                    const availableOption =
                        Array.from(
                            cabin.options
                        ).find(
                            function(option) {
                                return !option.disabled;
                            }
                        );


                    if (availableOption) {

                        cabin.value =
                            availableOption.value;

                    }

                }


                inventoryReady = true;

                calculatePrice();

            }
            catch (error) {

                console.error(
                    'Inventory error:',
                    error
                );

                alert(
                    'Could not load live seat availability.'
                );

            }

        }


        /* =========================
           DATE/TIME FORMAT
        ========================== */

        function toDateTime(
            dateStr,
            timeStr
        ) {

            if (
                !dateStr ||
                !timeStr ||
                timeStr === 'N/A'
            ) {

                return (
                    dateStr ||
                    new Date()
                        .toISOString()
                        .split('T')[0]
                ) +
                ' 00:00:00';

            }

            return (
                dateStr +
                ' ' +
                timeStr +
                ':00'
            );

        }


        /* =========================
           PRICE
        ========================== */

        function calculatePrice() {

            const cabin =
                document.getElementById(
                    'cabinSelect'
                ).value;


            const base =
                livePrices[cabin];


            if (base) {

                const total =
                    base +
                    Math.round(
                        base * 0.18
                    );


                document.getElementById(
                    'livePrice'
                ).innerText =
                    '₹ ' +
                    total.toLocaleString();


                localStorage.setItem(
                    'bookingTotal',
                    total
                );

            }

        }


        function onCabinChange() {

            const cabin =
                document.getElementById(
                    'cabinSelect'
                ).value;


            localStorage.setItem(
                'cabinClass',
                cabin
            );


            calculatePrice();

        }


        /* =========================
           REMEMBER BOOKING
        ========================== */

        function rememberBooking(id) {

            const key =
                'myBookings:' +
                (
                    localStorage.getItem(
                        'userName'
                    ) || 'guest'
                );


            let list = [];


            try {

                list =
                    JSON.parse(
                        localStorage.getItem(
                            key
                        ) || '[]'
                    );

            }
            catch (error) {

                list = [];

            }


            if (
                list.indexOf(id) === -1
            ) {

                list.push(id);

            }


            localStorage.setItem(
                key,
                JSON.stringify(list)
            );

        }


        /* =========================
           BOOKING SUBMIT
        ========================== */

        document
            .getElementById(
                'mainBookingForm'
            )
            .addEventListener(
                'submit',
                async function(event) {

                    event.preventDefault();


                    const name =
                        document.getElementById(
                            'pName'
                        ).value.trim();


                    const age =
                        document.getElementById(
                            'pAge'
                        ).value;


                    const gender =
                        document.getElementById(
                            'pGender'
                        ).value
                        .toUpperCase();


                    const passport =
                        document.getElementById(
                            'pID'
                        ).value.trim();


                    const cabin =
                        document.getElementById(
                            'cabinSelect'
                        ).value;


                    const realFlightId =
                        localStorage.getItem(
                            'flightId'
                        );


                    if (!name) {

                        alert(
                            'Please enter passenger name.'
                        );

                        return;

                    }


                    if (!passport) {

                        alert(
                            'Please enter Passport / ID Number.'
                        );

                        return;

                    }


                    if (!realFlightId) {

                        alert(
                            'Flight information is missing. Please select a flight again.'
                        );

                        window.location.href =
                            'flights.html';

                        return;

                    }


                    if (!inventoryReady) {

                        alert(
                            'Still loading live seat availability. Please wait a moment and try again.'
                        );

                        return;

                    }


                    try {

                        /*
                         * STEP 1
                         * Create passenger
                         */

                        const passengerResponse =
                            await fetch(
                                '/api/passenger',
                                {
                                    method: 'POST',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify({

                                            name:
                                                name,

                                            age:
                                                age,

                                            gender:
                                                gender,

                                            passport_number:
                                                passport

                                        })

                                }
                            );


                        const passengerData =
                            await passengerResponse.json();


                        if (
                            !passengerData.success
                        ) {

                            alert(
                                'Passenger error: ' +
                                passengerData.message
                            );

                            return;

                        }


                        /*
                         * STEP 2
                         * Assign real seat
                         */

                        const seatResponse =
                            await fetch(
                                '/api/seat',
                                {
                                    method: 'POST',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify({

                                            flight_id:
                                                realFlightId,

                                            class:
                                                cabin

                                        })

                                }
                            );


                        const seatData =
                            await seatResponse.json();


                        if (
                            !seatData.success
                        ) {

                            alert(
                                'Seat error: ' +
                                seatData.message
                            );

                            return;

                        }


                        const total =
                            Math.round(
                                seatData.price *
                                1.18
                            );


                        localStorage.setItem(
                            'selectedSeat',
                            seatData.seat_number
                        );


                        localStorage.setItem(
                            'bookingTotal',
                            total
                        );


                        /*
                         * STEP 3
                         * Create booking
                         */

                        const bookingResponse =
                            await fetch(
                                '/api/booking',
                                {
                                    method: 'POST',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify({

                                            agent_id: 1,

                                            flight_id:
                                                realFlightId,

                                            booking_date:
                                                new Date()
                                                    .toISOString()
                                                    .split('T')[0],

                                            passenger_id:
                                                passengerData.passenger_id,

                                            seat_id:
                                                seatData.seat_id,

                                            meal_preference:
                                                document
                                                    .getElementById(
                                                        'mealPref'
                                                    )
                                                    .value,

                                            wheelchair_required:
                                                document
                                                    .getElementById(
                                                        'ssrWheelchair'
                                                    )
                                                    .checked
                                                    ? 'YES'
                                                    : 'NO',

                                            special_assistance:
                                                document
                                                    .getElementById(
                                                        'ssrMedical'
                                                    )
                                                    .checked
                                                    ? 'MEDICAL SUPPORT'
                                                    : null,

                                            infant_bassinet_required:
                                                document
                                                    .getElementById(
                                                        'ssrInfant'
                                                    )
                                                    .checked
                                                    ? 'YES'
                                                    : 'NO'

                                        })

                                }
                            );


                        const bookingData =
                            await bookingResponse.json();


                        if (
                            !bookingData.success
                        ) {

                            alert(
                                'Booking failed: ' +
                                bookingData.message
                            );

                            return;

                        }


                        /*
                         * Save booking information
                         */

                        localStorage.setItem(
                            'booking_id',
                            bookingData.booking_id
                        );


                        rememberBooking(
                            bookingData.booking_id
                        );


                        localStorage.setItem(
                            'passengerName',
                            name
                        );


                        localStorage.setItem(
                            'passengerID',
                            passport
                        );


                        localStorage.setItem(
                            'bookingTotal',
                            total
                        );


                        /*
                         * Continue to payment
                         */

                        window.location.href =
                            'payment.html';

                    }
                    catch (error) {

                        console.error(
                            error
                        );

                        alert(
                            'Error: ' +
                            error.message
                        );

                    }

                }
            );


        /* =========================
           START
        ========================== */

        loadInventory();

    </script>
