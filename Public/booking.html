<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Ticket | AIR KERALA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="site-common.css"
    >

    <style>

        :root {
            --blue: #0878d1;
            --navy: #071b2e;
            --gold: #d7b56d;
            --light: #f4f8fc;
        }

        body {
            margin: 0;
            background:
                linear-gradient(
                    rgba(244, 249, 253, .93),
                    rgba(248, 251, 255, .96)
                ),
                url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2000&q=85");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        .booking-wrapper {
            max-width: 1050px;
            margin: 45px auto 70px;
            padding: 0 18px;
        }

        .booking-card {
            background: rgba(255,255,255,.97);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(7,27,46,.13);
            padding: 38px;
        }

        .page-title {
            color: var(--navy);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .section-title {
            border-left: 4px solid var(--gold);
            padding-left: 14px;
            color: var(--navy);
            font-weight: 800;
            margin: 30px 0 20px;
        }

        .flight-summary {
            background: linear-gradient(
                135deg,
                #eaf5ff,
                #f7fbff
            );
            border: 1px solid #cfe4f8;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .flight-airline {
            color: var(--blue);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .flight-route {
            color: var(--navy);
            font-size: 28px;
            font-weight: 800;
            margin: 6px 0;
        }

        .flight-info {
            color: #64748b;
            font-size: 14px;
        }

        .passenger-card {
            background: #fff;
            border: 1px solid #dfe7ef;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 5px 20px rgba(7,27,46,.05);
        }

        .passenger-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .passenger-number {
            font-weight: 800;
            color: var(--navy);
            font-size: 18px;
        }

        .passenger-badge {
            background: #eaf5ff;
            color: var(--blue);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .form-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .8px;
            font-weight: 800;
            color: #64748b;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            padding: 12px;
            border: 1px solid #d9e2eb;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(8,120,209,.08);
        }

        .service-box {
            background: #fffaf1;
            border: 1px solid #f0dfb7;
            border-radius: 11px;
            padding: 18px;
            margin-top: 18px;
        }

        .fare-box {
            background: var(--navy);
            color: white;
            border-radius: 13px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .fare-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: .7;
        }

        .fare-value {
            font-size: 25px;
            font-weight: 800;
        }

        .btn-payment {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 16px;
            margin-top: 20px;
            background: var(--blue);
            color: white;
            font-size: 16px;
            font-weight: 800;
        }

        .btn-payment:hover {
            background: #0565b0;
        }

        .error-box {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {

            .booking-card {
                padding: 22px;
            }

            .flight-route {
                font-size: 21px;
            }

            .fare-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

    </style>

</head>

<body>

<script
    src="site-common.js"
    data-page="book"
    data-auth="none"
></script>


<main class="booking-wrapper">

    <div class="booking-card">

        <h1 class="page-title">
            Passenger Details
        </h1>

        <p class="page-subtitle">
            Enter the details for everyone travelling on this booking.
        </p>


        <div class="flight-summary">

            <div
                class="flight-airline"
                id="flightAirline"
            >
                AIR KERALA
            </div>

            <div
                class="flight-route"
                id="flightRoute"
            >
                Loading flight...
            </div>

            <div
                class="flight-info"
                id="flightInfo"
            >
                Loading...
            </div>

        </div>


        <div class="error-box" id="errorBox"></div>


        <form id="bookingForm">

            <h3 class="section-title">
                Booking Details
            </h3>


            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Number of Passengers
                    </label>

                    <select
                        id="passengerCount"
                        class="form-select"
                    >

                        <option value="1">1 Passenger</option>
                        <option value="2">2 Passengers</option>
                        <option value="3">3 Passengers</option>
                        <option value="4">4 Passengers</option>
                        <option value="5">5 Passengers</option>
                        <option value="6">6 Passengers</option>
                        <option value="7">7 Passengers</option>
                        <option value="8">8 Passengers</option>
                        <option value="9">9 Passengers</option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Cabin Class
                    </label>

                    <select
                        id="cabinClass"
                        class="form-select"
                    >

                        <option value="Economy">
                            Economy
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="First">
                            First
                        </option>

                    </select>

                </div>

            </div>


            <div id="passengerContainer"></div>


            <div class="fare-box">

                <div>

                    <div class="fare-label">
                        Estimated Total Fare
                    </div>

                    <div>
                        Final amount is calculated by the server.
                    </div>

                </div>

                <div
                    class="fare-value"
                    id="fareValue"
                >
                    ₹ —
                </div>

            </div>


            <button
                type="submit"
                class="btn-payment"
                id="submitBtn"
            >
                Continue to Payment →
            </button>

        </form>

    </div>

</main>


<script>

const flightId =
    localStorage.getItem('flightId');

const flightNum =
    localStorage.getItem('flightNum');

const airline =
    localStorage.getItem('airline') ||
    'AIR KERALA';

const origin =
    localStorage.getItem('origin');

const destination =
    localStorage.getItem('dest');

const departure =
    localStorage.getItem('dep');

const arrival =
    localStorage.getItem('arr');

const flightDate =
    localStorage.getItem('flightDate');


if (!flightId) {

    alert(
        'Please select a flight first.'
    );

    window.location.href =
        'flights.html';
}


/* =========================================================
   FLIGHT SUMMARY
========================================================= */

document.getElementById(
    'flightAirline'
).textContent =
    airline +
    (
        flightNum
            ? ' · ' + flightNum
            : ''
    );


document.getElementById(
    'flightRoute'
).textContent =
    (origin || '-') +
    ' → ' +
    (destination || '-');


document.getElementById(
    'flightInfo'
).textContent =
    'Date: ' +
    (flightDate || '-') +
    ' · Departure: ' +
    (departure || '-') +
    ' · Arrival: ' +
    (arrival || '-');


/* =========================================================
   PASSENGER FORM
========================================================= */

const passengerContainer =
    document.getElementById(
        'passengerContainer'
    );


function passengerCard(index) {

    return `

        <div
            class="passenger-card"
            data-passenger="${index}"
        >

            <div class="passenger-heading">

                <div class="passenger-number">
                    Passenger ${index}
                </div>

                <div class="passenger-badge">
                    TRAVELLER ${index}
                </div>

            </div>


            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control passenger-name"
                        required
                        placeholder="Name as per ID"
                    >

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        class="form-control passenger-age"
                        min="1"
                        max="120"
                        required
                    >

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <select
                        class="form-select passenger-gender"
                    >

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Passport / ID Number
                    </label>

                    <input
                        type="text"
                        class="form-control passenger-id"
                        required
                        placeholder="Passport / Government ID"
                    >

                </div>

            </div>


            <div class="service-box">

                <div class="fw-bold mb-3">
                    Special Service Requests
                </div>


                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Meal Preference
                        </label>

                        <select
                            class="form-select passenger-meal"
                        >

                            <option value="None">
                                No Meal Required
                            </option>

                            <option value="Veg">
                                Vegetarian
                            </option>

                            <option value="Non-Veg">
                                Non-Vegetarian
                            </option>

                            <option value="Vegan">
                                Vegan
                            </option>

                            <option value="Jain">
                                Jain Meal
                            </option>

                            <option value="Hindu Non-Veg">
                                Hindu Non-Vegetarian
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Special Assistance
                        </label>

                        <select
                            class="form-select passenger-assistance"
                        >

                            <option value="None">
                                No Special Assistance
                            </option>

                            <option value="Mobility Assistance">
                                Mobility Assistance
                            </option>

                            <option value="Hearing Assistance">
                                Hearing Assistance
                            </option>

                            <option value="Visual Assistance">
                                Visual Assistance
                            </option>

                            <option value="Medical Support">
                                Medical Support
                            </option>

                            <option value="Other">
                                Other Assistance
                            </option>

                        </select>

                    </div>


                    <div class="col-12">

                        <div class="d-flex gap-4 flex-wrap">

                            <label class="form-check">

                                <input
                                    type="checkbox"
                                    class="form-check-input passenger-wheelchair"
                                >

                                <span class="form-check-label">
                                    Wheelchair Required
                                </span>

                            </label>


                            <label class="form-check">

                                <input
                                    type="checkbox"
                                    class="form-check-input passenger-infant"
                                >

                                <span class="form-check-label">
                                    Infant Bassinet
                                </span>

                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    `;
}


function renderPassengers() {

    const count =
        Number(
            document.getElementById(
                'passengerCount'
            ).value
        );

    passengerContainer.innerHTML = '';


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        passengerContainer.insertAdjacentHTML(
            'beforeend',
            passengerCard(i)
        );
    }


    updateFare();
}


document.getElementById(
    'passengerCount'
).addEventListener(
    'change',
    renderPassengers
);


/* =========================================================
   INVENTORY
========================================================= */

let prices = {};


async function loadInventory() {

    try {

        const response =
            await fetch(
                '/api/flights/ensure',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({

                            flight_number:
                                flightNum,

                            airline_name:
                                airline,

                            origin:
                                origin,

                            destination:
                                destination,

                            departure_time:
                                makeDateTime(
                                    flightDate,
                                    departure
                                ),

                            arrival_time:
                                makeDateTime(
                                    flightDate,
                                    arrival
                                )
                        })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                'Could not load flight'
            );
        }


        if (data.flight_id) {

            localStorage.setItem(
                'flightId',
                data.flight_id
            );
        }


        prices = {};


        (data.seats || [])
            .forEach(
                row => {

                    prices[
                        row.CLASS
                    ] =
                        Number(
                            row.price
                        );
                }
            );


        updateFare();

    } catch (error) {

        console.error(
            error
        );

        showError(
            'Could not load live flight availability. Please go back and select the flight again.'
        );
    }
}


function makeDateTime(
    date,
    time
) {

    if (!date)
        return '';

    return (
        date +
        ' ' +
        (
            time ||
            '00:00'
        ) +
        ':00'
    );
}


/* =========================================================
   FARE
========================================================= */

function updateFare() {

    const cabin =
        document.getElementById(
            'cabinClass'
        ).value;

    const count =
        Number(
            document.getElementById(
                'passengerCount'
            ).value
        );

    const price =
        Number(
            prices[cabin] || 0
        );

    const total =
        price * count;


    document.getElementById(
        'fareValue'
    ).textContent =
        total
            ? '₹ ' +
              total.toLocaleString(
                  'en-IN'
              )
            : '₹ —';


    if (total) {

        localStorage.setItem(
            'bookingTotal',
            String(total)
        );
    }


    localStorage.setItem(
        'cabinClass',
        cabin
    );
}


document.getElementById(
    'cabinClass'
).addEventListener(
    'change',
    updateFare
);


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    const box =
        document.getElementById(
            'errorBox'
        );

    box.textContent =
        message;

    box.style.display =
        'block';

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


/* =========================================================
   SUBMIT
========================================================= */

document.getElementById(
    'bookingForm'
).addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();


        const cards =
            Array.from(
                document.querySelectorAll(
                    '.passenger-card'
                )
            );


        const passengers =
            cards.map(
                card => ({

                    name:
                        card.querySelector(
                            '.passenger-name'
                        ).value.trim(),

                    age:
                        Number(
                            card.querySelector(
                                '.passenger-age'
                            ).value
                        ),

                    gender:
                        card.querySelector(
                            '.passenger-gender'
                        ).value,

                    passport_number:
                        card.querySelector(
                            '.passenger-id'
                        ).value.trim(),

                    meal_preference:
                        card.querySelector(
                            '.passenger-meal'
                        ).value,

                    special_assistance:
                        card.querySelector(
                            '.passenger-assistance'
                        ).value,

                    wheelchair_required:
                        card.querySelector(
                            '.passenger-wheelchair'
                        ).checked
                            ? 'YES'
                            : 'NO',

                    infant_bassinet_required:
                        card.querySelector(
                            '.passenger-infant'
                        ).checked
                            ? 'YES'
                            : 'NO'
                })
            );


        const cabin =
            document.getElementById(
                'cabinClass'
            ).value;


        const button =
            document.getElementById(
                'submitBtn'
            );


        button.disabled =
            true;

        button.textContent =
            'Creating Booking...';


        try {

            const response =
                await fetch(
                    '/api/booking-group',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        credentials:
                            'include',

                        body:
                            JSON.stringify({

                                flight_id:
                                    localStorage.getItem(
                                        'flightId'
                                    ),

                                cabin_class:
                                    cabin,

                                passengers:
                                    passengers,

                                booking_date:
                                    flightDate ||
                                    new Date()
                                        .toISOString()
                                        .split('T')[0]
                            })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    'Could not create booking'
                );
            }


            /*
             * Store only useful booking information.
             */
            localStorage.setItem(
                'booking_id',
                String(
                    data.booking_id
                )
            );


            localStorage.setItem(
                'bookingTotal',
                String(
                    data.total_amount
                )
            );


            localStorage.setItem(
                'passengerName',
                passengers[0].name
            );


            localStorage.setItem(
                'passengerCount',
                String(
                    passengers.length
                )
            );


            localStorage.setItem(
                'selectedSeats',
                JSON.stringify(
                    data.seats || []
                )
            );


            window.location.href =
                'payment.html?booking_id=' +
                encodeURIComponent(
                    data.booking_id
                );

        } catch (error) {

            console.error(
                error
            );

            showError(
                error.message
            );

            button.disabled =
                false;

            button.textContent =
                'Continue to Payment →';
        }

    }
);


/* =========================================================
   START
========================================================= */

renderPassengers();

loadInventory();

</script>

</body>
</html>
