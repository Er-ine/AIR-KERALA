<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Flight Details | AIR KERALA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --air-blue: #0878d1;
            --air-dark: #071b2e;
            --air-gold: #d7b56d;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #17202a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(180deg, #dceffd 0%, #eef7ff 45%, #ffffff 100%);
        }

        .navbar-solid {
            background: var(--air-dark);
            padding: 22px 5%;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 5;
        }

        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
        .brand-symbol {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.15); font-size: 21px;
        }
        .brand-name { font-size: 20px; font-weight: 700; letter-spacing: 3px; }

        .nav-links a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            padding: 10px 17px; font-size: 13px; font-weight: 500; border-radius: 4px;
        }
        .nav-links a.active { border-bottom: 2px solid var(--air-gold); }

        .login-btn {
            border: 1px solid rgba(255,255,255,0.55);
            background: rgba(255,255,255,0.08);
            color: white; padding: 9px 18px; border-radius: 4px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { background: white; color: var(--air-dark); }

        /* ---------- Sky scene (pure CSS/SVG, no image assets) ---------- */
        .sky {
            position: relative;
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 20px;
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            opacity: 0.85;
            animation: drift linear infinite;
        }
        .cloud::before, .cloud::after {
            content: "";
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud::before { width: 55%; height: 170%; top: -80%; left: 15%; }
        .cloud::after  { width: 40%; height: 130%; top: -50%; right: 12%; }

        .c1 { width: 220px; height: 60px;  top: 12%; left: -260px; animation-duration: 90s; }
        .c2 { width: 300px; height: 80px;  top: 58%; left: -340px; animation-duration: 120s; animation-delay: -40s; opacity: 0.7; }
        .c3 { width: 170px; height: 46px;  top: 32%; left: -200px; animation-duration: 75s;  animation-delay: -20s; opacity: 0.9; }
        .c4 { width: 250px; height: 66px;  top: 78%; left: -290px; animation-duration: 105s; animation-delay: -70s; opacity: 0.6; }

        @keyframes drift {
            from { transform: translateX(0); }
            to   { transform: translateX(calc(100vw + 600px)); }
        }

        .plane {
            position: absolute;
            top: 18%;
            right: 8%;
            width: 120px;
            opacity: 0.9;
            transform: rotate(-12deg);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-12deg); }
            50%      { transform: translateY(-14px) rotate(-12deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cloud, .plane { animation: none; }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 680px;
        }

        .eyebrow {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--air-blue);
            margin-bottom: 14px;
        }

        .hero-title {
            font-size: clamp(34px, 5vw, 56px);
            font-weight: 800;
            color: var(--air-dark);
            line-height: 1.1;
            margin: 0 0 16px;
        }

        .hero-sub {
            font-size: 17px;
            color: #4b5b6b;
            margin: 0 auto 36px;
            max-width: 520px;
            line-height: 1.6;
        }

        .btn-view {
            display: inline-block;
            background: var(--air-blue);
            color: white;
            text-decoration: none;
            padding: 17px 46px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 50px;
            box-shadow: 0 10px 28px rgba(8, 120, 209, 0.35);
            transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .btn-view:hover {
            background: #0565b0;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 14px 34px rgba(8, 120, 209, 0.45);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #64748b;
            background: rgba(255,255,255,0.7);
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .plane { width: 80px; right: 4%; top: 10%; }
        }
    </style>
</head>

<body>

    <header class="navbar-solid">
        <a href="index.html" class="brand">
            <div class="brand-symbol">✈</div>
            <div class="brand-name">AIR KERALA</div>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="liveflights.html" class="active">Book Flight</a>
            <a href="manage-booking.html">Manage Booking</a>
            <a href="payment.html">Payment</a>
        </nav>

        <button class="login-btn" onclick="window.location.href='index.html'">👤 Account</button>
    </header>

    <main class="sky">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="cloud c4"></div>

        <svg class="plane" viewBox="0 0 64 64" aria-hidden="true">
            <path fill="#0878d1" d="M62 8c-2-2-8 0-12 4L36 26 10 18l-4 4 20 10-8 8-10-2-3 3 10 6 6 10 3-3-2-10 8-8 10 20 4-4-8-26 14-14c4-4 6-10 4-12z"/>
        </svg>

        <div class="hero-content">
            <span class="eyebrow">LIVE FLIGHT DETAILS</span>
            <h1 class="hero-title">Your journey starts here</h1>
            <p class="hero-sub">See live domestic departures and continue straight to your passenger details.</p>
            <a id="viewFlightsBtn" href="booking.html" class="btn-view">View Flights →</a>
        </div>
    </main>

    <footer>© 2026 Air Kerala. All rights reserved. · Fly beyond.</footer>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert("🔒 Access Denied. Please login first.");
            window.location.href = "index.html";
        }

        // Carry whatever was entered on the Home page (from / to / date)
        // through to booking.html, where the live flight is chosen.
        (function () {
            const src = new URLSearchParams(window.location.search);
            const out = new URLSearchParams();
            ['from', 'to', 'date'].forEach(function (k) {
                if (src.get(k)) out.set(k, src.get(k));
            });
            const q = out.toString();
            document.getElementById('viewFlightsBtn').href = 'booking.html' + (q ? '?' + q : '');
        })();
    </script>
</body>
</html>
