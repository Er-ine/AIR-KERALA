<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Flight | AIR KERALA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --air-blue: #0878d1;
            --air-dark: #071b2e;
            --air-gold: #d7b56d;
            --white: #ffffff;
            --light: #f5f7fa;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #17202a;
            background-color: #fbfcfd;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Subtle Kerala backdrop — a soft wash, not a loud photo */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url("https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=2200&q=80");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.08;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgba(251,252,253,0.4) 0%, rgba(251,252,253,0.92) 40%);
        }

        /* =====================================================
           NAVBAR (solid variant of the homepage navbar)
        ===================================================== */

        .navbar-solid {
            background: var(--air-dark);
            padding: 22px 5%;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .brand-symbol {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            font-size: 21px;
        }

        .brand-name {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .brand-subtitle {
            display: block;
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.75);
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 10px 17px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            transition: 0.25s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.13);
            color: white;
        }

        .nav-links a.active {
            border-bottom: 2px solid var(--air-gold);
        }

        .login-btn {
            border: 1px solid rgba(255,255,255,0.55);
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: white;
            color: var(--air-dark);
        }

        /* =====================================================
           BOOK TICKET — single large, elevated white panel that
           holds the page title, filters and live flight results.
           Page background is a soft aviation-style sky wash.
        ===================================================== */

        body {
            background:
                radial-gradient(1200px 500px at 15% -10%, rgba(8,120,209,0.10), transparent 60%),
                radial-gradient(1000px 480px at 100% 0%, rgba(215,181,109,0.10), transparent 55%),
                linear-gradient(180deg, #eaf3fb 0%, #f5f8fb 35%, #f7f9fb 100%);
        }

        body::before, body::after { content: none; }

        .book-page {
            flex: 1;
            padding: 44px 5% 70px;
        }

        .book-container {
            width: 90%;
            max-width: 1480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 22px;
            box-shadow:
                0 40px 90px rgba(7,27,46,0.16),
                0 10px 28px rgba(7,27,46,0.08);
            padding: 48px 52px 56px;
        }

        .book-header { margin-bottom: 30px; }

        .book-eyebrow {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--air-blue);
            font-weight: 700;
        }

        .book-title {
            font-size: 30px;
            font-weight: 300;
            margin: 8px 0 4px;
            color: var(--air-dark);
        }

        .book-title strong { font-weight: 700; }

        .book-subtitle {
            color: #66809c;
            font-size: 14px;
        }

        /* ---------- Filter bar ---------- */

        .filter-bar {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr 1fr auto auto;
            gap: 16px;
            align-items: end;
            background: #f6f9fc;
            border: 1px solid #e6edf4;
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 34px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: #69727e;
            margin-bottom: 8px;
        }

        .field-input {
            width: 100%;
            border: 1px solid #d9e2ea;
            background: white;
            border-radius: 6px;
            padding: 11px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #17202a;
            outline: none;
        }

        .field-input:focus { border-color: var(--air-blue); }

        .search-button {
            border: none;
            background: var(--air-blue);
            color: white;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 22px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .search-button:hover { background: #0565b0; }

        .btn-clear {
            border: 1px solid #d9e2ea;
            background: white;
            color: #4b5563;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 20px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-clear:hover { border-color: #b7c2cc; color: #17202a; }

        /* =====================================================
           RESULTS
        ===================================================== */

        .results-heading {
            font-size: 18px;
            font-weight: 700;
            color: #10283e;
            margin-bottom: 4px;
        }

        .results-meta {
            font-size: 13px;
            color: #737b84;
            margin-bottom: 22px;
        }

        .airport-heading {
            font-size: 13px;
            font-weight: 700;
            color: var(--air-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 30px 0 14px;
        }

        .flight-card {
            background: #ffffff;
            border: 1px solid #e9eef3;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            transition: 0.2s;
        }

        .flight-card:hover {
            border-color: #cfe0f0;
            box-shadow: 0 10px 26px rgba(7,27,46,0.08);
        }

        .flight-id { min-width: 150px; }

        .flight-name {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 190px;
            color: #10283e;
        }

        .flight-route {
            flex: 1;
            min-width: 220px;
            text-align: center;
        }

        .flight-route .route-line {
            font-weight: 700;
            font-size: 16px;
            color: #17202a;
        }

        .flight-route .route-meta {
            font-size: 12px;
            color: #737b84;
            margin-top: 4px;
        }

        .flight-extra {
            min-width: 110px;
            text-align: center;
        }

        .flight-extra .extra-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9aa4ae;
            font-weight: 700;
        }

        .flight-extra .extra-value {
            font-size: 13px;
            font-weight: 700;
            color: #17202a;
            margin-top: 2px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-departed { background: #e6f4ea; color: #1f7a3d; }
        .status-gateclosed { background: #fdf1de; color: #9a6a13; }
        .status-default { background: #eef1f4; color: #4b5563; }

        .btn-view {
            border: none;
            background: var(--air-dark);
            color: white;
            padding: 11px 24px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-view:hover { background: var(--air-blue); color: white; }

        .empty-state {
            color: #737b84;
            font-size: 14px;
            padding: 30px 0;
            text-align: center;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            background: var(--air-dark);
            color: white;
            padding: 35px 5%;
            position: relative;
            z-index: 1;
        }

        .footer-container {
            max-width: 1250px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        @media (max-width: 1100px) {
            .filter-bar { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 900px) {
            .nav-links { display: none; }
            .book-container { width: 94%; padding: 32px 22px 40px; border-radius: 16px; }
            .flight-card { flex-direction: column; align-items: flex-start; }
            .flight-route { text-align: left; }
            .flight-extra { text-align: left; }
        }

        @media (max-width: 600px) {
            .filter-bar { grid-template-columns: 1fr; padding: 18px; }
            .book-title { font-size: 24px; }
        }

    </style>
</head>
<body>

    <header class="navbar-solid">

        <a href="index.html" class="brand">
            <div class="brand-symbol">✈</div>
            <div>
                <div class="brand-name">AIR KERALA</div>
                <span class="brand-subtitle">FLY BEYOND</span>
            </div>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="flights.html" class="active">Book Flight</a>
            <a href="booking.html">Manage Booking</a>
            <a href="payment.html">Payment</a>
        </nav>

        <button class="login-btn" onclick="window.location.href='index.html'">👤 Account</button>

    </header>

    <div class="book-page">
        <div class="book-container">

            <div class="book-header">
                <div class="book-eyebrow">BOOK TICKET</div>
                <h1 class="book-title">Find your <strong>next flight.</strong></h1>
                <p class="book-subtitle">Live domestic flights, updated in real time. Filters are optional — flights are shown below as soon as the page loads.</p>
            </div>

            <div class="filter-bar">

                <div class="field">
                    <label class="field-label">From</label>
                    <select id="fromFilter" class="field-input" onchange="filterByDate()">
                        <option value="COK">Kochi</option>
                        <option value="TRV">Thiruvananthapuram</option>
                        <option value="CCJ">Kozhikode</option>
                        <option value="CNN">Kannur</option>
                        <option value="BLR">Bengaluru</option>
                        <option value="MAA">Chennai</option>
                        <option value="HYD">Hyderabad</option>
                        <option value="BOM">Mumbai</option>
                        <option value="DEL">Delhi</option>
                        <option value="CCU">Kolkata</option>
                        <option value="PNQ">Pune</option>
                        <option value="GOI">Goa</option>
                        <option value="AMD">Ahmedabad</option>
                        <option value="JAI">Jaipur</option>
                        <option value="LKO">Lucknow</option>
                        <option value="IXC">Chandigarh</option>
                        <option value="BBI">Bhubaneswar</option>
                        <option value="PAT">Patna</option>
                        <option value="GAU">Guwahati</option>
                        <option value="IXE">Mangaluru</option>
                    </select>
                </div>

                <div class="field">
                    <label class="field-label">To</label>
                    <select id="toFilter" class="field-input" onchange="filterByDate()">
                        <option value="all">All Destinations</option>
                        <option value="COK">Kochi</option>
                        <option value="TRV">Thiruvananthapuram</option>
                        <option value="CCJ">Kozhikode</option>
                        <option value="CNN">Kannur</option>
                        <option value="BLR">Bengaluru</option>
                        <option value="MAA">Chennai</option>
                        <option value="HYD">Hyderabad</option>
                        <option value="BOM">Mumbai</option>
                        <option value="DEL">Delhi</option>
                        <option value="CCU">Kolkata</option>
                        <option value="PNQ">Pune</option>
                        <option value="GOI">Goa</option>
                        <option value="AMD">Ahmedabad</option>
                        <option value="JAI">Jaipur</option>
                        <option value="LKO">Lucknow</option>
                        <option value="IXC">Chandigarh</option>
                        <option value="BBI">Bhubaneswar</option>
                        <option value="PAT">Patna</option>
                        <option value="GAU">Guwahati</option>
                        <option value="IXE">Mangaluru</option>
                    </select>
                </div>

                <div class="field">
                    <label class="field-label">Travel Date</label>
                    <input type="date" id="travelDate" class="field-input" onchange="filterByDate()">
                </div>

                <button class="search-button" onclick="filterByDate()">Search Flights</button>
                <button class="btn-clear" onclick="clearFilters()">Clear Filters</button>

            </div>

            <div id="flightResults"></div>

        </div>
    </div>

    <footer>
        <div class="footer-container">
            <span>© 2026 Air Kerala. All rights reserved.</span>
            <span>Fly beyond.</span>
        </div>
    </footer>

    <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        alert("🔒 Access Denied. Please login first.");
        window.location.href = "index.html";
    }

    const airportNames = {
        COK: '🇮🇳 Kochi', TRV: '🇮🇳 Thiruvananthapuram', CCJ: '🇮🇳 Kozhikode',
        CNN: '🇮🇳 Kannur', BLR: '🇮🇳 Bengaluru', MAA: '🇮🇳 Chennai',
        HYD: '🇮🇳 Hyderabad', BOM: '🇮🇳 Mumbai', DEL: '🇮🇳 Delhi',
        CCU: '🇮🇳 Kolkata', PNQ: '🇮🇳 Pune', GOI: '🇮🇳 Goa',
        AMD: '🇮🇳 Ahmedabad', JAI: '🇮🇳 Jaipur', LKO: '🇮🇳 Lucknow',
        IXC: '🇮🇳 Chandigarh', BBI: '🇮🇳 Bhubaneswar', PAT: '🇮🇳 Patna',
        GAU: '🇮🇳 Guwahati', IXE: '🇮🇳 Mangaluru'
    };

    function cityName(code) {
        return airportNames[code] ? airportNames[code].split(' ').slice(1).join(' ') : code;
    }

    // Computes a simple HH:MM flight duration from two "HH:MM" strings,
    // assuming a same-day (or next-day rollover) flight. Only shown when
    // both times are known.
    function calcDuration(depHHMM, arrHHMM) {
        if (depHHMM === 'N/A' || arrHHMM === 'N/A') return null;
        const [dh, dm] = depHHMM.split(':').map(Number);
        const [ah, am] = arrHHMM.split(':').map(Number);
        if ([dh, dm, ah, am].some(isNaN)) return null;
        let mins = (ah * 60 + am) - (dh * 60 + dm);
        if (mins < 0) mins += 24 * 60;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
    }

    // Resets the filter bar to its defaults (From: Kochi, To: all
    // destinations, no date) and reloads the unfiltered live list.
    function clearFilters() {
        document.getElementById('fromFilter').value = 'COK';
        document.getElementById('toFilter').value = 'all';
        document.getElementById('travelDate').value = '';
        filterByDate();
    }

    async function filterByDate() {
        const date = document.getElementById('travelDate').value;
        const toDest = document.getElementById('toFilter').value;
        const fromFilter = document.getElementById('fromFilter').value;
        const container = document.getElementById('flightResults');
        container.innerHTML = `<p class="empty-state">Loading live domestic flights...</p>`;

        try {
            const today = date || new Date().toISOString().split('T')[0];

            // The backend now only queries the single airport the user
            // picked, instead of scanning all 20 on every search — that
            // scan was what burned through the whole monthly API quota.
            const liveRes = await fetch(
                '/api/live-flights?date=' + encodeURIComponent(today) +
                '&from=' + encodeURIComponent(fromFilter)
            );
            const liveData = await liveRes.json();

            if (!liveData.success) {
                container.innerHTML = '<p class="text-danger">Error loading flights: ' +
                    (liveData.message || 'Unknown error') + '</p>';
                return;
            }

            // liveData.flights is a flat, deduplicated list of domestic
            // departures from the single 'from' airport requested.
            let flights = liveData.flights || [];

            if (toDest !== 'all') {
                flights = flights.filter(function(f) {
                    const code = f.arrival && f.arrival.airport && (f.arrival.airport.iata || '').toUpperCase();
                    return code === toDest;
                });
            }

            // Group client-side by departure airport for display headings
            const grouped = {};
            flights.forEach(function(f) {
                const code = (f.departure && f.departure.airport && f.departure.airport.iata)
                    ? f.departure.airport.iata.toUpperCase()
                    : 'OTHER';
                if (!grouped[code]) grouped[code] = [];
                grouped[code].push(f);
            });

            container.innerHTML =
                '<div class="results-heading">Live Domestic Flights</div>' +
                '<div class="results-meta">' + today + (liveData.cached ? ' · cached results' : '') + '</div>';

            if (liveData.airportError) {
                container.innerHTML += '<p class="text-danger">Note: live data for ' +
                    (airportNames[fromFilter] || fromFilter) + ' could not be fully retrieved (' +
                    liveData.airportError + ').</p>';
            }

            let totalShown = 0;

            Object.keys(grouped).forEach(function(code) {
                const list = grouped[code];
                if (!list.length) return;

                container.innerHTML += '<div class="airport-heading">' + (airportNames[code] || code) + ' Airport</div>';

                list.slice(0, 10).forEach(function(f) {
                    const dep = (f.departure && f.departure.scheduledTime && f.departure.scheduledTime.local) ? f.departure.scheduledTime.local.slice(11, 16) : 'N/A';
                    const arr = (f.arrival && f.arrival.scheduledTime && f.arrival.scheduledTime.local) ? f.arrival.scheduledTime.local.slice(11, 16) : 'N/A';
                    const destCode = (f.arrival && f.arrival.airport && f.arrival.airport.iata) ? f.arrival.airport.iata.toUpperCase() : '';
                    const dest = destCode ? cityName(destCode) : ((f.arrival && f.arrival.airport && f.arrival.airport.name) || 'Unknown');
                    const airlineName = (f.airline && f.airline.name) ? f.airline.name : 'Unknown';
                    const aircraftModel = (f.aircraft && f.aircraft.model) ? f.aircraft.model : '';
                    const flightNum = f.number || '';
                    const status = f.status || 'Unknown';
                    const statusClass = status === 'Departed' ? 'status-departed' : status === 'GateClosed' ? 'status-gateclosed' : 'status-default';
                    const originCity = cityName(code);

                    const bookingUrl = 'booking.html?number=' + encodeURIComponent(flightNum) +
                        '&airline=' + encodeURIComponent(airlineName) +
                        '&origin=' + encodeURIComponent(originCity) +
                        '&dest=' + encodeURIComponent(dest) +
                        '&dep=' + encodeURIComponent(dep) +
                        '&arr=' + encodeURIComponent(arr) +
                        '&aircraft=' + encodeURIComponent(aircraftModel) +
                        '&status=' + encodeURIComponent(status) +
                        '&date=' + encodeURIComponent(today);

                    const duration = calcDuration(dep, arr);

                    const actionBtn = status === 'Departed'
                        ? '<span class="text-muted small fst-italic">Flight departed</span>'
                        : '<a href="' + bookingUrl + '" class="btn-view">Book Now</a>';

                    // Available seats and fare are only known once a flight is
                    // selected — the existing /api/flights/ensure endpoint
                    // creates real seat inventory and pricing for that one
                    // flight (used on the booking page). Calling it for every
                    // flight in this list would seed data for flights the
                    // user never picks, so those two fields are intentionally
                    // left off this card and shown after "Book Now" instead.
                    container.innerHTML += `
                        <div class="flight-card">
                            <div class="flight-id">
                                <small class="text-muted fw-bold">${flightNum}</small>
                                <div class="flight-name">${airlineName}</div>
                                <small class="text-muted">${aircraftModel}</small>
                            </div>
                            <div class="flight-route">
                                <div class="route-line">${originCity} ➔ ${dest}</div>
                                <div class="route-meta">🕒 Dep: ${dep} · Arr: ${arr}${duration ? ' · ' + duration : ''}</div>
                            </div>
                            <div class="flight-extra">
                                <div class="extra-label">Date</div>
                                <div class="extra-value">${today}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${status}</span>
                            ${actionBtn}
                        </div>`;
                    totalShown++;
                });
            });

            if (totalShown === 0) {
                container.innerHTML += '<p class="empty-state">No flights found for the selected filters. Try a different date, destination, or clear your filters.</p>';
            }

        } catch (err) {
            container.innerHTML = '<p class="text-danger">Error loading flights: ' + err.message + '</p>';
        }
    }

    // Pick up whatever was entered on the homepage search box and
    // run the live search immediately with those values pre-filled.
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const from = params.get('from');
        const to = params.get('to');
        const date = params.get('date');

        if (from) document.getElementById('fromFilter').value = from;
        if (to) document.getElementById('toFilter').value = to;
        if (date) document.getElementById('travelDate').value = date;

        filterByDate();
    };
    </script>
</body>
</html>
