<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Flight | AIR KERALA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --air-blue: #0878d1;
            --air-dark: #071b2e;
            --air-gold: #d7b56d;
            --white: #ffffff;
            --light: #f5f7fa;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #17202a;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           NAVBAR (solid variant of the homepage navbar)
        ===================================================== */

        .navbar-solid {
            background: var(--air-dark);
            padding: 22px 5%;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .brand-symbol {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            font-size: 21px;
        }

        .brand-name {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .brand-subtitle {
            display: block;
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.75);
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 10px 17px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            transition: 0.25s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.13);
            color: white;
        }

        .nav-links a.active {
            border-bottom: 2px solid var(--air-gold);
        }

        .login-btn {
            border: 1px solid rgba(255,255,255,0.55);
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: white;
            color: var(--air-dark);
        }

        /* =====================================================
           SEARCH BAND — continues the homepage search-card style
        ===================================================== */

        .search-band {
            background: var(--air-dark);
            color: white;
            padding: 45px 5% 0;
        }

        .search-eyebrow {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--air-gold);
            font-weight: 700;
        }

        .search-title {
            font-size: 32px;
            font-weight: 300;
            margin: 10px 0 6px;
        }

        .search-title strong {
            font-weight: 700;
        }

        .search-subtitle {
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .search-wrapper {
            max-width: 1180px;
            margin: 0 auto;
            transform: translateY(40px);
        }

        .search-card {
            background: white;
            color: #17202a;
            border-radius: 5px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.18);
        }

        .search-fields {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr 1fr 180px;
            gap: 0;
            padding: 20px;
        }

        .field {
            padding: 4px 20px;
            border-right: 1px solid #e5e7eb;
        }

        .field:last-of-type {
            border-right: none;
        }

        .field-label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: #69727e;
            margin-bottom: 8px;
        }

        .field-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            font-weight: 600;
            color: #17202a;
            background: transparent;
            cursor: pointer;
        }

        .search-button {
            border: none;
            background: var(--air-blue);
            color: white;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 15px;
            width: 100%;
        }

        .search-button:hover {
            background: #0565b0;
            transform: translateY(-1px);
        }

        /* =====================================================
           RESULTS
        ===================================================== */

        .results-section {
            max-width: 1180px;
            margin: 90px auto 60px;
            padding: 0 5%;
            flex: 1;
        }

        .results-heading {
            font-size: 20px;
            font-weight: 700;
            color: #10283e;
            margin-bottom: 25px;
        }

        .airport-heading {
            font-size: 14px;
            font-weight: 700;
            color: var(--air-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 35px 0 15px;
        }

        .flight-card {
            background: white;
            border-top: 1px solid #dce2e8;
            padding: 22px 5px;
            margin-bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .flight-card:hover {
            transform: translateX(4px);
        }

        .flight-name {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
            color: #10283e;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-departed { background: #e6f4ea; color: #1f7a3d; }
        .status-gateclosed { background: #fdf1de; color: #9a6a13; }
        .status-default { background: #eef1f4; color: #4b5563; }

        .btn-view {
            border: none;
            background: var(--air-dark);
            color: white;
            padding: 10px 22px;
            border-radius: 3px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-view:hover {
            background: var(--air-blue);
            color: white;
        }

        .empty-state {
            color: #737b84;
            font-size: 14px;
            padding: 20px 0;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            background: var(--air-dark);
            color: white;
            padding: 35px 5%;
        }

        .footer-container {
            max-width: 1250px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        @media (max-width: 900px) {
            .nav-links { display: none; }
            .search-fields { grid-template-columns: 1fr 1fr; }
            .field { border-right: none; border-bottom: 1px solid #e5e7eb; padding: 14px; }
            .search-wrapper { transform: none; margin-top: 20px; }
            .results-section { margin-top: 40px; }
            .flight-card { flex-direction: column; align-items: flex-start; }
        }

    </style>
</head>
<body>

    <header class="navbar-solid">

        <a href="index.html" class="brand">
            <div class="brand-symbol">✈</div>
            <div>
                <div class="brand-name">AIR KERALA</div>
                <span class="brand-subtitle">FLY BEYOND</span>
            </div>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="flights.html" class="active">Book Flight</a>
            <a href="booking.html">Manage Booking</a>
            <a href="payment.html">Payment</a>
        </nav>

        <button class="login-btn" onclick="window.location.href='index.html'">👤 Account</button>

    </header>

    <section class="search-band">

        <div class="search-eyebrow">FIND YOUR FLIGHT</div>
        <h1 class="search-title">Search <strong>live availability.</strong></h1>
        <p class="search-subtitle">Real-time flights, sourced worldwide.</p>

        <div class="search-wrapper">
            <div class="search-card">
                <div class="search-fields">

                    <div class="field">
                        <label class="field-label">From</label>
                        <select id="fromFilter" class="field-input" onchange="filterByDate()">
                            <option value="all">All Airports</option>
                            <option value="DEL">Delhi</option>
                            <option value="BOM">Mumbai</option>
                            <option value="BLR">Bangalore</option>
                            <option value="MAA">Chennai</option>
                            <option value="CCU">Kolkata</option>
                            <option value="HYD">Hyderabad</option>
                            <option value="COK">Kochi</option>
                            <option value="DXB">Dubai</option>
                            <option value="LHR">London</option>
                            <option value="JFK">New York</option>
                            <option value="SIN">Singapore</option>
                            <option value="DOH">Doha</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="field-label">To</label>
                        <select id="toFilter" class="field-input" onchange="filterByDate()">
                            <option value="all">All Destinations</option>
                            <option value="DEL">Delhi</option>
                            <option value="BOM">Mumbai</option>
                            <option value="BLR">Bangalore</option>
                            <option value="MAA">Chennai</option>
                            <option value="CCU">Kolkata</option>
                            <option value="HYD">Hyderabad</option>
                            <option value="COK">Kochi</option>
                            <option value="DXB">Dubai</option>
                            <option value="LHR">London</option>
                            <option value="JFK">New York</option>
                            <option value="SIN">Singapore</option>
                            <option value="DOH">Doha</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="field-label">Travel Date</label>
                        <input type="date" id="travelDate" class="field-input" onchange="filterByDate()">
                    </div>

                    <button class="search-button" onclick="filterByDate()">Search Flights →</button>

                </div>
            </div>
        </div>

    </section>

    <section class="results-section">
        <div id="flightResults"></div>
    </section>

    <footer>
        <div class="footer-container">
            <span>© 2026 Air Kerala. All rights reserved.</span>
            <span>Fly beyond.</span>
        </div>
    </footer>

    <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        alert("🔒 Access Denied. Please login first.");
        window.location.href = "index.html";
    }

    const airportNames = {
        DEL: '🇮🇳 Delhi', BOM: '🇮🇳 Mumbai', BLR: '🇮🇳 Bangalore',
        MAA: '🇮🇳 Chennai', CCU: '🇮🇳 Kolkata', HYD: '🇮🇳 Hyderabad',
        COK: '🇮🇳 Kochi', DXB: '🇦🇪 Dubai', LHR: '🇬🇧 London',
        JFK: '🇺🇸 New York', SIN: '🇸🇬 Singapore', DOH: '🇶🇦 Doha'
    };

    async function filterByDate() {
        const date = document.getElementById('travelDate').value;
        const toDest = document.getElementById('toFilter').value;
        const fromFilter = document.getElementById('fromFilter').value;
        const container = document.getElementById('flightResults');
        container.innerHTML = `<p class="empty-state">Loading live flights worldwide...</p>`;

        try {
            const today = date || new Date().toISOString().split('T')[0];
            const liveRes = await fetch('/api/live-flights?date=' + today);
            const liveData = await liveRes.json();
            let airports = liveData.flights || [];

            if (fromFilter !== 'all') {
                airports = airports.filter(a => a.airport === fromFilter);
            }

            container.innerHTML = '<h2 class="results-heading">🌍 Live Worldwide Flights for: ' + today + '</h2>';

            let totalShown = 0;

            airports.forEach(function({ airport, departures }) {
                if (!departures || !departures.length) return;

                let filtered = departures;
                if (toDest !== 'all') {
                    filtered = departures.filter(function(f) {
                        const arrAirport = f.arrival && f.arrival.airport;
                        if (!arrAirport) return false;
                        const code = (arrAirport.iata || arrAirport.icao || '').toUpperCase();
                        if (code) return code === toDest;
                        const destName = (arrAirport.name || '').toLowerCase();
                        const destCity = (airportNames[toDest] || '').split(' ').slice(1).join(' ').toLowerCase();
                        return destCity && destName.includes(destCity);
                    });
                }
                if (!filtered.length) return;

                container.innerHTML += '<div class="airport-heading">' + (airportNames[airport] || airport) + ' Airport</div>';

                filtered.slice(0, 10).forEach(function(f) {
                    const dep = (f.departure && f.departure.scheduledTime && f.departure.scheduledTime.local) ? f.departure.scheduledTime.local.slice(11, 16) : 'N/A';
                    const arr = (f.arrival && f.arrival.scheduledTime && f.arrival.scheduledTime.local) ? f.arrival.scheduledTime.local.slice(11, 16) : 'N/A';
                    const dest = (f.arrival && f.arrival.airport && f.arrival.airport.name) ? f.arrival.airport.name : 'Unknown';
                    const airlineName = (f.airline && f.airline.name) ? f.airline.name : 'Unknown';
                    const aircraftModel = (f.aircraft && f.aircraft.model) ? f.aircraft.model : '';
                    const flightNum = f.number || '';
                    const status = f.status || 'Unknown';
                    const statusClass = status === 'Departed' ? 'status-departed' : status === 'GateClosed' ? 'status-gateclosed' : 'status-default';
                    const originCity = airportNames[airport] ? airportNames[airport].split(' ').slice(1).join(' ') : airport;

                    const detailsUrl = 'flight-details.html?number=' + encodeURIComponent(flightNum) +
                        '&airline=' + encodeURIComponent(airlineName) +
                        '&origin=' + encodeURIComponent(originCity) +
                        '&dest=' + encodeURIComponent(dest) +
                        '&dep=' + encodeURIComponent(dep) +
                        '&arr=' + encodeURIComponent(arr) +
                        '&aircraft=' + encodeURIComponent(aircraftModel) +
                        '&status=' + encodeURIComponent(status);

                    const actionBtn = status === 'Departed'
                        ? '<span class="text-muted small fst-italic">Flight departed</span>'
                        : '<a href="' + detailsUrl + '" class="btn-view">View Flight</a>';

                    container.innerHTML += `
                        <div class="flight-card">
                            <div style="min-width:150px;">
                                <small class="text-muted fw-bold">${flightNum}</small>
                                <div class="flight-name">${airlineName}</div>
                                <small class="text-muted">${aircraftModel}</small>
                            </div>
                            <div class="text-center flex-grow-1">
                                <div class="fw-bold h6 mb-1">${originCity} ➔ ${dest}</div>
                                <div class="small text-muted">🕒 Dep: ${dep} | Arr: ${arr}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${status}</span>
                            ${actionBtn}
                        </div>`;
                    totalShown++;
                });
            });

            if (totalShown === 0) {
                container.innerHTML += '<p class="empty-state">No flights found for selected filters.</p>';
            }

        } catch (err) {
            container.innerHTML = '<p class="text-danger">Error loading flights: ' + err.message + '</p>';
        }
    }

    // Pick up whatever was entered on the homepage search box and
    // run the live search immediately with those values pre-filled.
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const from = params.get('from');
        const to = params.get('to');
        const date = params.get('date');

        if (from) document.getElementById('fromFilter').value = from;
        if (to) document.getElementById('toFilter').value = to;
        if (date) document.getElementById('travelDate').value = date;

        filterByDate();
    };
    </script>
</body>
</html>
