<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search Flights | AIR KERALA</title>


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Shared CSS -->

    <link
        rel="stylesheet"
        href="site-common.css"
    >


    <style>

        /* =================================================
           PAGE BACKGROUND
        ================================================= */

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(5, 26, 45, 0.48),
                    rgba(5, 26, 45, 0.58)
                ),
                url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2200&q=90");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            background-repeat: no-repeat;

        }


        /* =================================================
           MAIN
        ================================================= */

        .flights-page {

            min-height:
                calc(100vh - 76px);

            padding:
                55px 20px 80px;

        }


        .flights-container {

            max-width:
                1150px;

            margin:
                0 auto;

        }


        /* =================================================
           SEARCH BOX
        ================================================= */

        .flight-search-box {

            background:
                rgba(255,255,255,0.97);

            border:
                1px solid
                rgba(255,255,255,0.9);

            border-radius:
                12px;

            padding:
                32px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.28);

            backdrop-filter:
                blur(12px);

        }


        .flight-search-title {

            margin: 0;

            color:
                #071b2e;

            font-size:
                29px;

            font-weight:
                700;

        }


        .flight-search-subtitle {

            margin:
                8px 0 28px;

            color:
                #64748b;

            font-size:
                13px;

        }


        .form-label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                #64748b;

            font-size:
                11px;

            font-weight:
                700;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

        }


        .form-control,
        .form-select {

            width:
                100%;

            min-height:
                48px;

            padding:
                12px 14px;

            border:
                1px solid
                #dbe4ed;

            border-radius:
                6px;

            background:
                white;

            color:
                #17202a;

            font-family:
                inherit;

            outline:
                none;

        }


        .form-control:focus,
        .form-select:focus {

            border-color:
                #0878d1;

            box-shadow:
                0 0 0 3px
                rgba(8,120,209,0.1);

        }


        .search-button {

            width:
                100%;

            min-height:
                48px;

            border:
                none;

            border-radius:
                6px;

            background:
                #0878d1;

            color:
                white;

            font-family:
                inherit;

            font-size:
                13px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                0.25s;

        }


        .search-button:hover {

            background:
                #0565b0;

            transform:
                translateY(-1px);

        }


        .clear-button {

            width:
                100%;

            min-height:
                48px;

            border:
                1px solid
                #dbe4ed;

            border-radius:
                6px;

            background:
                #f1f5f9;

            color:
                #071b2e;

            font-family:
                inherit;

            font-size:
                13px;

            font-weight:
                600;

            cursor:
                pointer;

        }


        /* =================================================
           RESULTS HEADER
        ================================================= */

        .results-area {

            margin-top:
                30px;

        }


        .results-heading {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            margin-bottom:
                15px;

        }


        .results-heading h2 {

            margin:
                0;

            color:
                white;

            font-size:
                22px;

            font-weight:
                700;

            text-shadow:
                0 2px 10px
                rgba(0,0,0,0.35);

        }


        .flight-count {

            padding:
                7px 14px;

            border-radius:
                20px;

            background:
                rgba(255,255,255,0.95);

            color:
                #071b2e;

            font-size:
                11px;

            font-weight:
                700;

        }


        /* =================================================
           RESULTS
        ================================================= */

        #flightResults {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(320px, 1fr)
                );

            gap:
                18px;

        }


        .empty-state,
        .loading-state {

            grid-column:
                1 / -1;

            background:
                rgba(255,255,255,0.96);

            border-radius:
                10px;

            padding:
                45px 25px;

            text-align:
                center;

            color:
                #64748b;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.18);

        }


        .empty-state h3 {

            color:
                #071b2e;

            margin-bottom:
                8px;

        }


        /* =================================================
           FLIGHT CARD
        ================================================= */

        .flight-card {

            background:
                rgba(255,255,255,0.97);

            border:
                1px solid
                rgba(255,255,255,0.8);

            border-radius:
                10px;

            padding:
                23px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.2);

            transition:
                transform 0.25s,
                box-shadow 0.25s;

        }


        .flight-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 22px 50px
                rgba(0,0,0,0.25);

        }


        .airline {

            color:
                #0878d1;

            font-size:
                11px;

            font-weight:
                700;

            text-transform:
                uppercase;

            letter-spacing:
                0.8px;

        }


        .flight-number {

            color:
                #071b2e;

            font-size:
                19px;

            font-weight:
                700;

            margin-top:
                3px;

        }


        .route {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            margin:
                23px 0;

        }


        .airport {

            flex:
                1;

            text-align:
                center;

        }


        .airport-code {

            color:
                #071b2e;

            font-size:
                24px;

            font-weight:
                700;

        }


        .airport-city {

            color:
                #64748b;

            font-size:
                11px;

            margin-top:
                2px;

        }


        .route-line {

            position:
                relative;

            flex:
                1;

            height:
                1px;

            background:
                #cbd5e1;

        }


        .route-line::after {

            content:
                "✈";

            position:
                absolute;

            top:
                50%;

            left:
                50%;

            transform:
                translate(-50%, -50%);

            padding:
                0 7px;

            background:
                white;

            color:
                #0878d1;

            font-size:
                14px;

        }


        .flight-time {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                10px;

            padding-top:
                15px;

            border-top:
                1px solid
                #e2e8f0;

            color:
                #64748b;

            font-size:
                11px;

        }


        .flight-time strong {

            color:
                #17202a;

        }


        .status {

            display:
                inline-block;

            margin-top:
                15px;

            padding:
                5px 10px;

            border-radius:
                20px;

            background:
                #ecfdf5;

            color:
                #047857;

            font-size:
                10px;

            font-weight:
                700;

            text-transform:
                uppercase;

        }


        .book-flight-button {

            width:
                100%;

            margin-top:
                17px;

            padding:
                12px;

            border:
                none;

            border-radius:
                5px;

            background:
                #0878d1;

            color:
                white;

            font-family:
                inherit;

            font-size:
                13px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                0.25s;

        }


        .book-flight-button:hover {

            background:
                #0565b0;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .flights-page {

                padding:
                    30px 12px 60px;

            }


            .flight-search-box {

                padding:
                    22px;

            }


            .flight-search-title {

                font-size:
                    24px;

            }


            .results-heading {

                align-items:
                    flex-start;

            }

        }

    </style>

</head>


<body>


    <!-- Shared navbar -->

    <script
        src="site-common.js"
        data-page="flights"
    ></script>


    <main class="flights-page">

        <div class="flights-container">


            <!-- =================================================
                 SEARCH
            ================================================== -->

            <section class="flight-search-box">

                <h1 class="flight-search-title">
                    Search Flights
                </h1>

                <p class="flight-search-subtitle">
                    Find available flights and choose your journey.
                </p>


                <div class="row g-3">


                    <!-- FROM -->

                    <div class="col-md-4">

                        <label
                            for="fromSel"
                            class="form-label"
                        >
                            From
                        </label>

                        <select
                            id="fromSel"
                            class="form-select"
                        >

                            <option value="">
                                Select departure
                            </option>

                        </select>

                    </div>


                    <!-- TO -->

                    <div class="col-md-4">

                        <label
                            for="toSel"
                            class="form-label"
                        >
                            To
                        </label>

                        <select
                            id="toSel"
                            class="form-select"
                        >

                            <option value="all">
                                Any destination
                            </option>

                        </select>

                    </div>


                    <!-- DATE -->

                    <div class="col-md-4">

                        <label
                            for="dateSel"
                            class="form-label"
                        >
                            Travel Date
                        </label>

                        <input
                            type="date"
                            id="dateSel"
                            class="form-control"
                        >

                    </div>


                    <!-- SEARCH -->

                    <div class="col-md-8">

                        <button
                            type="button"
                            class="search-button"
                            onclick="searchFlights()"
                        >
                            Search Flights
                        </button>

                    </div>


                    <!-- CLEAR -->

                    <div class="col-md-4">

                        <button
                            type="button"
                            class="clear-button"
                            onclick="clearFilters()"
                        >
                            Clear Filters
                        </button>

                    </div>

                </div>

            </section>


            <!-- =================================================
                 RESULTS
            ================================================== -->

            <section class="results-area">

                <div class="results-heading">

                    <h2>
                        Live Flight Details
                    </h2>

                    <span
                        class="flight-count"
                        id="flightCount"
                    >
                        0 flights
                    </span>

                </div>


                <div id="flightResults">

                    <div class="empty-state">

                        <h3>
                            Search for a flight
                        </h3>

                        <p>
                            Select your departure airport,
                            destination and travel date.
                        </p>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <script>

        /* =====================================================
           LOGIN CHECK
        ===================================================== */

        if (
            localStorage.getItem(
                "isLoggedIn"
            ) !== "true"
        ) {

            window.location.href =
                "index.html";

        }


        /* =====================================================
           AIRPORTS
        ===================================================== */

        const airportNames = {

            COK: "Kochi",

            TRV: "Thiruvananthapuram",

            CCJ: "Kozhikode",

            CNN: "Kannur",

            BLR: "Bengaluru",

            MAA: "Chennai",

            HYD: "Hyderabad",

            BOM: "Mumbai",

            DEL: "Delhi",

            CCU: "Kolkata",

            PNQ: "Pune",

            GOI: "Goa",

            AMD: "Ahmedabad",

            JAI: "Jaipur",

            LKO: "Lucknow",

            IXC: "Chandigarh",

            BBI: "Bhubaneswar",

            PAT: "Patna",

            GAU: "Guwahati",

            IXE: "Mangaluru"

        };


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const fromSel =
            document.getElementById(
                "fromSel"
            );


        const toSel =
            document.getElementById(
                "toSel"
            );


        const dateSel =
            document.getElementById(
                "dateSel"
            );


        const flightResults =
            document.getElementById(
                "flightResults"
            );


        const flightCount =
            document.getElementById(
                "flightCount"
            );


        /* =====================================================
           TODAY
        ===================================================== */

        const today =
            new Date()
                .toISOString()
                .split("T")[0];


        dateSel.min =
            today;

        dateSel.value =
            today;


        /* =====================================================
           POPULATE AIRPORTS
        ===================================================== */

        Object.keys(
            airportNames
        ).forEach(
            function (code) {

                const fromOption =
                    document.createElement(
                        "option"
                    );

                fromOption.value =
                    code;

                fromOption.textContent =
                    airportNames[code] +
                    " (" +
                    code +
                    ")";

                fromSel.appendChild(
                    fromOption
                );


                const toOption =
                    document.createElement(
                        "option"
                    );

                toOption.value =
                    code;

                toOption.textContent =
                    airportNames[code] +
                    " (" +
                    code +
                    ")";

                toSel.appendChild(
                    toOption
                );

            }
        );


        /* =====================================================
           URL PARAMETERS
        ===================================================== */

        const query =
            new URLSearchParams(
                window.location.search
            );


        if (
            query.get("from")
        ) {

            fromSel.value =
                query.get("from");

        }


        if (
            query.get("to")
        ) {

            toSel.value =
                query.get("to");

        }


        if (
            query.get("date")
        ) {

            dateSel.value =
                query.get("date");

        }


        /* =====================================================
           SEARCH FLIGHTS
        ===================================================== */

        async function searchFlights() {

            const from =
                fromSel.value;


            const to =
                toSel.value;


            const date =
                dateSel.value;


            if (!from) {

                alert(
                    "Please select a departure airport."
                );

                return;

            }


            if (!date) {

                alert(
                    "Please select a travel date."
                );

                return;

            }


            flightResults.innerHTML = `

                <div class="loading-state">

                    <div
                        class="spinner-border text-primary mb-3"
                    ></div>

                    <div>
                        Fetching live flights...
                    </div>

                </div>

            `;


            flightCount.textContent =
                "Loading...";


            try {

                const response =
                    await fetch(
                        "/api/live-flights?date=" +
                        encodeURIComponent(
                            date
                        ) +
                        "&from=" +
                        encodeURIComponent(
                            from
                        )
                    );


                const data =
                    await response.json();


                if (
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to load flights."
                    );

                }


                let flights =
                    (data.flights || [])
                    .map(
                        function (flight) {

                            const depLocal =
                                flight.departure &&
                                flight.departure.scheduledTime &&
                                flight.departure.scheduledTime.local;


                            const arrLocal =
                                flight.arrival &&
                                flight.arrival.scheduledTime &&
                                flight.arrival.scheduledTime.local;


                            const destinationCode =
                                (
                                    flight.arrival &&
                                    flight.arrival.airport &&
                                    flight.arrival.airport.iata
                                || ""
                                )
                                .toUpperCase();


                            return {

                                number:
                                    flight.number ||
                                    "",

                                airline:
                                    (
                                        flight.airline &&
                                        flight.airline.name
                                    ) ||
                                    "Unknown",

                                status:
                                    flight.status ||
                                    "Unknown",

                                originCode:
                                    from,

                                origin:
                                    airportNames[from] ||
                                    from,

                                destCode:
                                    destinationCode,

                                dest:
                                    destinationCode
                                        ? (
                                            airportNames[
                                                destinationCode
                                            ] ||
                                            destinationCode
                                        )
                                        :
                                        (
                                            flight.arrival &&
                                            flight.arrival.airport &&
                                            flight.arrival.airport.name
                                        ) ||
                                        "Unknown",

                                dep:
                                    depLocal
                                        ? depLocal.slice(
                                            11,
                                            16
                                        )
                                        : "N/A",

                                arr:
                                    arrLocal
                                        ? arrLocal.slice(
                                            11,
                                            16
                                        )
                                        : "N/A",

                                date:
                                    date

                            };

                        }
                    )
                    .filter(
                        function (flight) {

                            return (
                                flight.number &&
                                flight.status !==
                                "Departed"
                            );

                        }
                    );


                /* Destination filter */

                if (
                    to &&
                    to !== "all"
                ) {

                    flights =
                        flights.filter(
                            function (flight) {

                                return (
                                    flight.destCode ===
                                    to
                                );

                            }
                        );

                }


                renderFlights(
                    flights
                );

            }
            catch (error) {

                console.error(
                    error
                );


                flightResults.innerHTML = `

                    <div class="empty-state">

                        <h3>
                            Unable to load flights
                        </h3>

                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>

                    </div>

                `;


                flightCount.textContent =
                    "0 flights";

            }

        }


        /* =====================================================
           RENDER
        ===================================================== */

        function renderFlights(
            flights
        ) {

            flightCount.textContent =
                flights.length +
                (
                    flights.length === 1
                        ? " flight"
                        : " flights"
                );


            if (
                flights.length === 0
            ) {

                flightResults.innerHTML = `

                    <div class="empty-state">

                        <h3>
                            No flights found
                        </h3>

                        <p>
                            No upcoming flights were found
                            for the selected journey.
                        </p>

                    </div>

                `;

                return;

            }


            flightResults.innerHTML =
                flights
                    .map(
                        function (flight) {

                            return `

                                <article
                                    class="flight-card"
                                >

                                    <div class="airline">
                                        ${escapeHtml(
                                            flight.airline
                                        )}
                                    </div>


                                    <div class="flight-number">
                                        ${escapeHtml(
                                            flight.number
                                        )}
                                    </div>


                                    <div class="route">


                                        <div class="airport">

                                            <div
                                                class="airport-code"
                                            >
                                                ${escapeHtml(
                                                    flight.originCode
                                                )}
                                            </div>

                                            <div
                                                class="airport-city"
                                            >
                                                ${escapeHtml(
                                                    flight.origin
                                                )}
                                            </div>

                                        </div>


                                        <div
                                            class="route-line"
                                        ></div>


                                        <div class="airport">

                                            <div
                                                class="airport-code"
                                            >
                                                ${escapeHtml(
                                                    flight.destCode ||
                                                    "---"
                                                )}
                                            </div>

                                            <div
                                                class="airport-city"
                                            >
                                                ${escapeHtml(
                                                    flight.dest
                                                )}
                                            </div>

                                        </div>

                                    </div>


                                    <div
                                        class="flight-time"
                                    >

                                        <span>
                                            Departure:
                                            <strong>
                                                ${escapeHtml(
                                                    flight.dep
                                                )}
                                            </strong>
                                        </span>

                                        <span>
                                            Arrival:
                                            <strong>
                                                ${escapeHtml(
                                                    flight.arr
                                                )}
                                            </strong>
                                        </span>

                                    </div>


                                    <span
                                        class="status"
                                    >
                                        ${escapeHtml(
                                            flight.status
                                        )}
                                    </span>


                                    <button
                                        type="button"
                                        class="book-flight-button"
                                        onclick='selectFlight(${JSON.stringify(
                                            flight
                                        )})'
                                    >
                                        Book This Flight →
                                    </button>

                                </article>

                            `;

                        }
                    )
                    .join("");

        }


        /* =====================================================
           SELECT FLIGHT
        ===================================================== */

        async function selectFlight(
            flight
        ) {

            /*
               Save selected flight information.
            */

            localStorage.setItem(
                "flightNum",
                flight.number
            );


            localStorage.setItem(
                "airline",
                flight.airline
            );


            localStorage.setItem(
                "origin",
                flight.origin
            );


            localStorage.setItem(
                "dest",
                flight.dest
            );


            localStorage.setItem(
                "dep",
                flight.dep
            );


            localStorage.setItem(
                "arr",
                flight.arr
            );


            localStorage.setItem(
                "flightDate",
                flight.date
            );


            localStorage.setItem(
                "cabinClass",
                "Economy"
            );


            try {

                /*
                   Make sure this live flight exists
                   in MongoDB.
                */

                const response =
                    await fetch(
                        "/api/flights/ensure",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    flight_number:
                                        flight.number,

                                    airline_name:
                                        flight.airline,

                                    origin:
                                        flight.origin,

                                    destination:
                                        flight.dest,

                                    departure_time:
                                        toDateTime(
                                            flight.date,
                                            flight.dep
                                        ),

                                    arrival_time:
                                        toDateTime(
                                            flight.date,
                                            flight.arr
                                        )

                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    !data.success
                ) {

                    alert(
                        "Could not prepare this flight: " +
                        (
                            data.message ||
                            "Unknown error"
                        )
                    );

                    return;

                }


                localStorage.setItem(
                    "flightId",
                    data.flight_id
                );


                /*
                   Passenger details page.
                */

                window.location.href =
                    "booking.html";

            }
            catch (error) {

                console.error(
                    error
                );

                alert(
                    "Could not select this flight: " +
                    error.message
                );

            }

        }


        /* =====================================================
           DATETIME
        ===================================================== */

        function toDateTime(
            date,
            time
        ) {

            if (
                !date ||
                !time ||
                time === "N/A"
            ) {

                return (
                    date ||
                    today
                ) +
                " 00:00:00";

            }


            return (
                date +
                " " +
                time +
                ":00"
            );

        }


        /* =====================================================
           CLEAR
        ===================================================== */

        function clearFilters() {

            fromSel.value =
                "";

            toSel.value =
                "all";

            dateSel.value =
                today;


            flightResults.innerHTML = `

                <div class="empty-state">

                    <h3>
                        Search for a flight
                    </h3>

                    <p>
                        Select your departure airport,
                        destination and travel date.
                    </p>

                </div>

            `;


            flightCount.textContent =
                "0 flights";

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =====================================================
           AUTOMATIC SEARCH
        ===================================================== */

        if (
            query.get("from") ||
            query.get("to") ||
            query.get("date")
        ) {

            searchFlights();

        }

    </script>
