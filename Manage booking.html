<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Kerala - Manage My Booking</title>

    <link rel="stylesheet" href="site-common.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #17324d;

            background:
                linear-gradient(
                    rgba(226, 241, 248, 0.88),
                    rgba(245, 249, 252, 0.94)
                ),
                url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2000&q=85")
                center / cover fixed no-repeat;

            min-height: 100vh;
        }

        .manage-page {
            min-height: 100vh;
            padding: 115px 20px 70px;
        }

        .manage-container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 36px;
            color: #12395b;
        }

        .page-header p {
            margin: 0;
            color: #687b8d;
            font-size: 15px;
        }

        .message-box {
            display: none;
            padding: 15px 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .error-box {
            background: #fff0f0;
            border: 1px solid #ffd0d0;
            color: #b83232;
        }

        .info-box {
            background: #edf7fb;
            border: 1px solid #cce8f2;
            color: #23627a;
        }

        .section {
            margin-bottom: 38px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 22px;
            color: #12395b;
        }

        .booking-count {
            background: #e4f3f8;
            color: #16739a;

            padding: 6px 12px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
        }

        .booking-list {
            display: grid;
            gap: 18px;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 15px 40px rgba(23, 50, 77, 0.13);

            border: 1px solid rgba(210, 225, 234, 0.8);
        }

        .booking-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;

            padding-bottom: 20px;
            border-bottom: 1px solid #e6edf2;
        }

        .flight-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .airline-icon {
            width: 48px;
            height: 48px;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #12395b,
                #167ca8
            );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .flight-number {
            font-size: 18px;
            font-weight: 800;
            color: #12395b;
        }

        .airline-name {
            margin-top: 4px;
            color: #748596;
            font-size: 13px;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-confirmed {
            background: #e7f7ee;
            color: #168047;
        }

        .status-cancelled {
            background: #fff0f0;
            color: #c0392b;
        }

        .status-pending {
            background: #fff7df;
            color: #9a6a00;
        }

        .status-default {
            background: #edf1f4;
            color: #657687;
        }

        .route-section {
            display: grid;
            grid-template-columns: 1fr auto 1fr;

            align-items: center;

            gap: 20px;

            padding: 25px 0;
        }

        .airport {
            text-align: left;
        }

        .airport:last-child {
            text-align: right;
        }

        .airport-code {
            font-size: 28px;
            font-weight: 800;
            color: #12395b;
        }

        .airport-name {
            margin-top: 4px;
            color: #738495;
            font-size: 12px;
        }

        .flight-arrow {
            text-align: center;
            color: #2382aa;
        }

        .flight-line {
            width: 100px;
            height: 1px;
            background: #cbdbe5;
            position: relative;
            margin: 0 auto 7px;
        }

        .flight-line::after {
            content: "✈";
            position: absolute;
            right: 0;
            top: -10px;

            background: white;
            padding-left: 5px;

            font-size: 16px;
            color: #167ca8;
        }

        .date-text {
            font-size: 11px;
            color: #7c8c9a;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;

            margin-bottom: 20px;
        }

        .detail {
            background: #f6f9fb;
            border-radius: 10px;
            padding: 12px;
        }

        .detail-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;

            color: #8493a0;

            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 13px;
            font-weight: 700;
            color: #2a4054;

            word-break: break-word;
        }

        .booking-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-top: 18px;
            border-top: 1px solid #e6edf2;

            gap: 15px;
        }

        .booking-id {
            font-size: 11px;
            color: #8493a0;
        }

        .booking-id strong {
            color: #506577;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-button {
            border: none;
            border-radius: 9px;

            padding: 10px 16px;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        .view-button {
            background: #e7f3f8;
            color: #176c91;
        }

        .view-button:hover {
            background: #d8edf5;
        }

        .cancel-button {
            background: #fff0f0;
            color: #c0392b;
        }

        .cancel-button:hover {
            background: #ffe0e0;
        }

        .cancel-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            background: rgba(255, 255, 255, 0.96);

            border-radius: 18px;
            padding: 45px 25px;

            text-align: center;

            box-shadow: 0 12px 35px rgba(23, 50, 77, 0.10);
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            margin: 0 0 8px;
            color: #12395b;
        }

        .empty-state p {
            margin: 0 0 20px;
            color: #718394;
            font-size: 14px;
        }

        .book-button {
            display: inline-block;

            padding: 12px 20px;

            background: #167ca8;
            color: white;

            text-decoration: none;

            border-radius: 9px;

            font-size: 13px;
            font-weight: 700;
        }

        .book-button:hover {
            background: #12698f;
        }

        /* Details modal */

        .modal-overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(8, 30, 45, 0.58);

            z-index: 9999;

            padding: 25px;

            overflow-y: auto;
        }

        .details-modal {
            width: 100%;
            max-width: 650px;

            margin: 50px auto;

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);

            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 18px;
            top: 15px;

            border: none;
            background: transparent;

            font-size: 25px;
            color: #718394;

            cursor: pointer;
        }

        .modal-title {
            margin: 0 0 22px;
            color: #12395b;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-detail {
            background: #f6f9fb;
            border-radius: 10px;
            padding: 13px;
        }

        .modal-detail.full {
            grid-column: 1 / -1;
        }

        .modal-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #8493a0;
            margin-bottom: 5px;
        }

        .modal-value {
            font-size: 14px;
            font-weight: 700;
            color: #243b53;
        }

        @media (max-width: 800px) {

            .manage-page {
                padding-top: 100px;
            }

            .booking-top {
                flex-direction: column;
            }

            .details-grid {
                grid-template-columns: 1fr 1fr;
            }

            .route-section {
                gap: 10px;
            }

            .airport-code {
                font-size: 23px;
            }
        }

        @media (max-width: 550px) {

            .page-header h1 {
                font-size: 28px;
            }

            .booking-card {
                padding: 18px;
            }

            .route-section {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .airport,
            .airport:last-child {
                text-align: center;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .booking-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions {
                width: 100%;
            }

            .action-button {
                flex: 1;
            }

            .modal-grid {
                grid-template-columns: 1fr;
            }

            .modal-detail.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <!-- Shared Air Kerala Navbar -->
    <script
        src="site-common.js"
        data-page="manage">
    </script>


    <main class="manage-page">

        <div class="manage-container">

            <!-- PAGE HEADER -->

            <div class="page-header">

                <h1>
                    Manage My Booking
                </h1>

                <p>
                    View and manage your Air Kerala bookings.
                </p>

            </div>


            <div
                id="errorMessage"
                class="message-box error-box">
            </div>


            <div
                id="infoMessage"
                class="message-box info-box">
            </div>


            <!-- =================================================
                 UPCOMING BOOKINGS
            ================================================== -->

            <section class="section">

                <div class="section-title">

                    <h2>
                        Upcoming Bookings
                    </h2>

                    <span
                        class="booking-count"
                        id="upcomingCount">
                        0
                    </span>

                </div>

                <div
                    class="booking-list"
                    id="upcomingBookings">
                </div>

            </section>


            <!-- =================================================
                 PREVIOUS BOOKINGS
            ================================================== -->

            <section class="section">

                <div class="section-title">

                    <h2>
                        Previous Bookings
                    </h2>

                    <span
                        class="booking-count"
                        id="previousCount">
                        0
                    </span>

                </div>

                <div
                    class="booking-list"
                    id="previousBookings">
                </div>

            </section>

        </div>

    </main>


    <!-- =========================================================
         BOOKING DETAILS MODAL
    ========================================================== -->

    <div
        class="modal-overlay"
        id="detailsModal">

        <div class="details-modal">

            <button
                class="close-modal"
                onclick="closeDetails()">
                ×
            </button>

            <h2
                class="modal-title">
                Booking Details
            </h2>

            <div
                class="modal-grid"
                id="modalContent">
            </div>

        </div>

    </div>


    <script>

        // =========================================================
        // GLOBAL DATA
        // =========================================================

        let allBookings = [];


        // =========================================================
        // PAGE LOAD
        // =========================================================

        document.addEventListener(
            'DOMContentLoaded',
            loadMyBookings
        );


        // =========================================================
        // LOAD USER BOOKINGS
        // =========================================================

        async function loadMyBookings() {

            hideMessages();

            try {

                const response = await fetch(
                    '/api/booking/my-bookings',
                    {
                        method: 'GET',
                        credentials: 'include'
                    }
                );


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        'Unable to load bookings.'
                    );

                }


                const bookingIds =
                    data.booking_ids || [];


                if (bookingIds.length === 0) {

                    renderEmptyState();

                    return;
                }


                /*
                 * The existing backend returns booking IDs.
                 *
                 * We therefore fetch the complete details
                 * for each booking using:
                 *
                 * /api/booking/booking-details/:booking_id
                 */

                const bookingRequests =
                    bookingIds.map(async (id) => {

                        try {

                            const response =
                                await fetch(
                                    '/api/booking/booking-details/' +
                                    encodeURIComponent(id),
                                    {
                                        method: 'GET',
                                        credentials: 'include'
                                    }
                                );


                            const details =
                                await response.json();


                            if (
                                response.ok &&
                                details.success &&
                                details.data &&
                                details.data.length
                            ) {

                                return details.data[0];

                            }

                        } catch (error) {

                            console.error(
                                'BOOKING DETAILS ERROR:',
                                error
                            );

                        }

                        return null;

                    });


                const results =
                    await Promise.all(
                        bookingRequests
                    );


                allBookings =
                    results.filter(
                        booking => booking !== null
                    );


                renderBookings();


            } catch (error) {

                console.error(
                    'MANAGE BOOKINGS ERROR:',
                    error
                );

                showError(
                    error.message ||
                    'Unable to load your bookings.'
                );

            }

        }


        // =========================================================
        // RENDER BOOKINGS
        // =========================================================

        function renderBookings() {

            const upcomingContainer =
                document.getElementById(
                    'upcomingBookings'
                );

            const previousContainer =
                document.getElementById(
                    'previousBookings'
                );


            upcomingContainer.innerHTML = '';

            previousContainer.innerHTML = '';


            const upcoming =
                [];

            const previous =
                [];


            allBookings.forEach(
                booking => {

                    if (isUpcoming(booking)) {

                        upcoming.push(
                            booking
                        );

                    } else {

                        previous.push(
                            booking
                        );

                    }

                }
            );


            document.getElementById(
                'upcomingCount'
            ).textContent =
                upcoming.length;


            document.getElementById(
                'previousCount'
            ).textContent =
                previous.length;


            if (upcoming.length === 0) {

                upcomingContainer.innerHTML =
                    createEmptyMessage(
                        'No Upcoming Bookings',
                        'You currently have no upcoming flights.'
                    );

            } else {

                upcoming.forEach(
                    booking => {

                        upcomingContainer.insertAdjacentHTML(
                            'beforeend',
                            createBookingCard(
                                booking,
                                true
                            )
                        );

                    }
                );

            }


            if (previous.length === 0) {

                previousContainer.innerHTML =
                    createEmptyMessage(
                        'No Previous Bookings',
                        'Your completed or cancelled bookings will appear here.'
                    );

            } else {

                previous.forEach(
                    booking => {

                        previousContainer.insertAdjacentHTML(
                            'beforeend',
                            createBookingCard(
                                booking,
                                false
                            )
                        );

                    }
                );

            }

        }


        // =========================================================
        // DETERMINE UPCOMING BOOKING
        // =========================================================

        function isUpcoming(booking) {

            if (
                booking.STATUS_ === 'CANCELLED'
            ) {

                return false;

            }


            /*
             * Use the flight departure time
             * when available.
             */

            if (booking.DEP_TEXT) {

                const departure =
                    new Date(
                        booking.DEP_TEXT
                    );


                if (
                    !Number.isNaN(
                        departure.getTime()
                    )
                ) {

                    return departure > new Date();

                }

            }


            /*
             * If the date cannot be parsed,
             * treat non-cancelled bookings as active.
             */

            return booking.STATUS_ !== 'CANCELLED';

        }


        // =========================================================
        // CREATE BOOKING CARD
        // =========================================================

        function createBookingCard(
            booking,
            upcoming
        ) {

            const status =
                booking.STATUS_ ||
                'CONFIRMED';


            const statusClass =
                getStatusClass(status);


            const cancelDisabled =
                status === 'CANCELLED' ||
                !upcoming;


            const price =
                booking.PRICE !== null &&
                booking.PRICE !== undefined
                    ? formatCurrency(
                        booking.PRICE
                    )
                    : '-';


            const bookingId =
                String(
                    booking.BOOKING_ID || ''
                );


            return `
                <article class="booking-card">

                    <div class="booking-top">

                        <div class="flight-info">

                            <div class="airline-icon">
                                ✈
                            </div>

                            <div>

                                <div class="flight-number">
                                    ${escapeHtml(
                                        booking.FLIGHT_NUMBER || '-'
                                    )}
                                </div>

                                <div class="airline-name">
                                    ${escapeHtml(
                                        booking.AIRLINE_NAME || 'Air Kerala'
                                    )}
                                </div>

                            </div>

                        </div>


                        <span class="status ${statusClass}">
                            ${escapeHtml(status)}
                        </span>

                    </div>


                    <div class="route-section">

                        <div class="airport">

                            <div class="airport-code">
                                ${escapeHtml(
                                    booking.ORIGIN || '-'
                                )}
                            </div>

                            <div class="airport-name">
                                Departure
                            </div>

                        </div>


                        <div class="flight-arrow">

                            <div class="flight-line"></div>

                            <div class="date-text">
                                ${escapeHtml(
                                    formatDateTime(
                                        booking.DEP_TEXT
                                    )
                                )}
                            </div>

                        </div>


                        <div class="airport">

                            <div class="airport-code">
                                ${escapeHtml(
                                    booking.DESTINATION || '-'
                                )}
                            </div>

                            <div class="airport-name">
                                Arrival
                            </div>

                        </div>

                    </div>


                    <div class="details-grid">

                        <div class="detail">

                            <div class="detail-label">
                                Passenger
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(
                                    booking.NAME || '-'
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Seat
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(
                                    booking.SEAT_NUMBER || '-'
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Cabin
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(
                                    booking.CLASS || '-'
                                )}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                Amount
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(price)}
                            </div>

                        </div>

                    </div>


                    <div class="booking-footer">

                        <div class="booking-id">

                            Booking ID:
                            <strong>
                                ${escapeHtml(
                                    bookingId
                                )}
                            </strong>

                        </div>


                        <div class="actions">

                            <button
                                class="action-button view-button"
                                onclick="viewDetails('${escapeJs(
                                    bookingId
                                )}')">

                                View Details

                            </button>


                            <button
                                class="action-button cancel-button"
                                ${cancelDisabled ? 'disabled' : ''}
                                onclick="cancelBooking('${escapeJs(
                                    bookingId
                                )}')">

                                Cancel Booking

                            </button>

                        </div>

                    </div>

                </article>
            `;

        }


        // =========================================================
        // VIEW DETAILS
        // =========================================================

        function viewDetails(bookingId) {

            const booking =
                allBookings.find(
                    item =>
                        String(
                            item.BOOKING_ID
                        ) === String(bookingId)
                );


            if (!booking) {

                showError(
                    'Booking details could not be found.'
                );

                return;
            }


            const modalContent =
                document.getElementById(
                    'modalContent'
                );


            modalContent.innerHTML = `

                ${createModalDetail(
                    'Booking ID',
                    booking.BOOKING_ID
                )}

                ${createModalDetail(
                    'Status',
                    booking.STATUS_
                )}

                ${createModalDetail(
                    'Flight',
                    booking.FLIGHT_NUMBER
                )}

                ${createModalDetail(
                    'Airline',
                    booking.AIRLINE_NAME
                )}

                ${createModalDetail(
                    'Passenger',
                    booking.NAME
                )}

                ${createModalDetail(
                    'Age',
                    booking.AGE
                )}

                ${createModalDetail(
                    'Gender',
                    booking.GENDER
                )}

                ${createModalDetail(
                    'Route',
                    (booking.ORIGIN || '-') +
                    ' → ' +
                    (booking.DESTINATION || '-'),
                    true
                )}

                ${createModalDetail(
                    'Departure',
                    formatDateTime(
                        booking.DEP_TEXT
                    )
                )}

                ${createModalDetail(
                    'Arrival',
                    formatDateTime(
                        booking.ARR_TEXT
                    )
                )}

                ${createModalDetail(
                    'Seat',
                    booking.SEAT_NUMBER
                )}

                ${createModalDetail(
                    'Cabin',
                    booking.CLASS
                )}

                ${createModalDetail(
                    'Meal',
                    booking.MEAL_PREFERENCE
                )}

                ${createModalDetail(
                    'Payment',
                    booking.PAYMENT_STATUS
                )}

                ${createModalDetail(
                    'Amount',
                    booking.AMOUNT !== null &&
                    booking.AMOUNT !== undefined
                        ? formatCurrency(
                            booking.AMOUNT
                        )
                        : '-'
                )}

            `;


            document.getElementById(
                'detailsModal'
            ).style.display = 'block';

        }


        // =========================================================
        // CREATE MODAL DETAIL
        // =========================================================

        function createModalDetail(
            label,
            value,
            full = false
        ) {

            return `

                <div class="modal-detail ${full ? 'full' : ''}">

                    <div class="modal-label">
                        ${escapeHtml(label)}
                    </div>

                    <div class="modal-value">
                        ${escapeHtml(
                            value === null ||
                            value === undefined ||
                            value === ''
                                ? '-'
                                : String(value)
                        )}
                    </div>

                </div>

            `;

        }


        // =========================================================
        // CLOSE DETAILS
        // =========================================================

        function closeDetails() {

            document.getElementById(
                'detailsModal'
            ).style.display = 'none';

        }


        // Close modal by clicking outside
        document.getElementById(
            'detailsModal'
        ).addEventListener(
            'click',
            function (event) {

                if (
                    event.target === this
                ) {

                    closeDetails();

                }

            }
        );


        // =========================================================
        // CANCEL BOOKING
        // =========================================================

        async function cancelBooking(
            bookingId
        ) {

            const booking =
                allBookings.find(
                    item =>
                        String(
                            item.BOOKING_ID
                        ) === String(bookingId)
                );


            if (!booking) {

                showError(
                    'Booking not found.'
                );

                return;
            }


            if (
                booking.STATUS_ === 'CANCELLED'
            ) {

                return;

            }


            const confirmed =
                confirm(
                    'Are you sure you want to cancel this booking?'
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(
                        '/api/booking/cancel-booking',
                        {
                            method: 'PUT',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            credentials: 'include',

                            body: JSON.stringify({
                                booking_id:
                                    bookingId
                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        'Unable to cancel booking.'
                    );

                }


                showInfo(
                    'Booking cancelled successfully.'
                );


                // Reload from MongoDB
                await loadMyBookings();


            } catch (error) {

                console.error(
                    'CANCEL BOOKING ERROR:',
                    error
                );

                showError(
                    error.message ||
                    'Unable to cancel booking.'
                );

            }

        }


        // =========================================================
        // EMPTY STATE
        // =========================================================

        function renderEmptyState() {

            document.getElementById(
                'upcomingBookings'
            ).innerHTML =
                createEmptyMessage(
                    'No Upcoming Bookings',
                    'You currently have no upcoming flights.'
                );


            document.getElementById(
                'previousBookings'
            ).innerHTML =
                createEmptyMessage(
                    'No Previous Bookings',
                    'Your completed or cancelled bookings will appear here.'
                );


            document.getElementById(
                'upcomingCount'
            ).textContent = '0';


            document.getElementById(
                'previousCount'
            ).textContent = '0';

        }


        function createEmptyMessage(
            title,
            message
        ) {

            return `

                <div class="empty-state">

                    <div class="empty-icon">
                        ✈
                    </div>

                    <h3>
                        ${escapeHtml(title)}
                    </h3>

                    <p>
                        ${escapeHtml(message)}
                    </p>

                    <a
                        href="flights.html"
                        class="book-button">

                        Book a Flight

                    </a>

                </div>

            `;

        }


        // =========================================================
        // STATUS CLASS
        // =========================================================

        function getStatusClass(
            status
        ) {

            const value =
                String(
                    status || ''
                ).toUpperCase();


            if (
                value === 'CONFIRMED' ||
                value === 'BOOKED' ||
                value === 'PAID'
            ) {

                return 'status-confirmed';

            }


            if (
                value === 'CANCELLED'
            ) {

                return 'status-cancelled';

            }


            if (
                value === 'PENDING'
            ) {

                return 'status-pending';

            }


            return 'status-default';

        }


        // =========================================================
        // DATE FORMATTING
        // =========================================================

        function formatDateTime(
            value
        ) {

            if (!value) {

                return '-';

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return value;

            }


            return date.toLocaleString(
                'en-IN',
                {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }
            );

        }


        // =========================================================
        // CURRENCY
        // =========================================================

        function formatCurrency(
            amount
        ) {

            const number =
                Number(amount);


            if (
                !Number.isFinite(number)
            ) {

                return '-';

            }


            return new Intl.NumberFormat(
                'en-IN',
                {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0
                }
            ).format(number);

        }


        // =========================================================
        // HTML ESCAPING
        // =========================================================

        function escapeHtml(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return '';

            }


            return String(value)
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }


        function escapeJs(
            value
        ) {

            return String(value || '')
                .replace(
                    /\\/g,
                    '\\\\'
                )
                .replace(
                    /'/g,
                    "\\'"
                )
                .replace(
                    /"/g,
                    '\\"'
                );

        }


        // =========================================================
        // MESSAGES
        // =========================================================

        function showError(
            message
        ) {

            const box =
                document.getElementById(
                    'errorMessage'
                );

            box.textContent =
                message;

            box.style.display =
                'block';

        }


        function showInfo(
            message
        ) {

            const box =
                document.getElementById(
                    'infoMessage'
                );

            box.textContent =
                message;

            box.style.display =
                'block';

            setTimeout(
                () => {
                    box.style.display =
                        'none';
                },
                4000
            );

        }


        function hideMessages() {

            document.getElementById(
                'errorMessage'
            ).style.display = 'none';

            document.getElementById(
                'infoMessage'
            ).style.display = 'none';

        }

    </script>

</body>
